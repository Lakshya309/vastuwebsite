openapi: 3.1.0

info:
  title: Manglam Vastu API
  version: "1.0.0"
  summary: Read-only reference of the deployed Manglam Vastu HTTP API.
  description: |
    This document describes the API **as it is currently implemented** in
    `app/api/**/route.ts`. It was generated by reading the route handlers
    directly; it is not aspirational. Where the implementation has a security or
    correctness problem, the operation is annotated with an `x-known-issues`
    array instead of being described as if it were safe.

    ## Scope

    * 35 Next.js route files exposing 43 HTTP operations.
    * A separate section documents the internal Python "Vastu Spatial Engine"
      microservice that `/api/analysis/objects` proxies to.

    ## How to read this document

    * `x-auth` records how a caller is authenticated:
      `none`, `session-or-bearer` (NextAuth cookie **or** mobile JWT),
      `bearer`, or `session`.
    * `x-owner-check` records whether the handler actually verifies that the
      caller owns the resource it is mutating. `none` means any authenticated
      user can act on any project id.
    * `x-known-issues` lists concrete defects. See `known-gaps.md` for the full
      write-up.

    ## Authentication in one paragraph

    Almost every protected route calls `validateAuth()`
    (`lib/auth.ts:176`). That helper checks the `Authorization: Bearer <jwt>`
    header **first**; if the header is absent or the JWT does not verify it
    silently falls back to the NextAuth session cookie. So both a browser with
    a `next-auth.session-token` cookie and a mobile app holding a Bearer token
    can call the same endpoint, and no endpoint needs to know which. The one
    exception is `GET /api/auth/user`, which calls `getServerSession` directly
    and therefore requires the cookie.

    ## Errors

    Error envelopes are **not** uniform. Handlers independently use
    `{ message }`, `{ error }`, `{ message, error }`, `{ error, details }` and
    `{ message, needs_payment }`. Always read both `message` and `error` and
    treat either as the human-readable failure. See `errors.md`.

    ## Markdown

    Human-readable companions live next to this file in `docs/api/`.
  license:
    name: UNLICENSED
  contact:
    name: Manglam Vastu
    url: https://manglamvastu.in

servers:
  - url: https://manglamvastu.in
    description: Production
  - url: http://localhost:3000
    description: Local development

tags:
  - name: System
    description: Liveness probes and health aggregation.
  - name: Authentication
    description: NextAuth session handlers, email/password signup, and mobile JWT issuing.
  - name: Users
    description: Profile reads scoped to the authenticated caller.
  - name: Projects
    description: Project CRUD and ownership.
  - name: Floor Plan Objects
    description: Placed-object persistence on a project.
  - name: Uploads
    description: Floor-plan images and plot videos in Cloudflare R2.
  - name: Analysis
    description: Analysis lifecycle, premium gating, and report generation.
  - name: Payments
    description: Razorpay order creation, verification, and webhooks.
  - name: Subscriptions
    description: Plan status and cancellation.
  - name: Astrologer
    description: Practitioner onboarding and assigned projects.
  - name: Admin
    description: Admin-only plan, credit, role, and application management.

security: []

paths:

  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Aggregate health of the Next.js app and the Python engine
      description: |
        Proxies `GET {MICROSERVICE_URL}/health` on the Python "Vastu Spatial
        Engine" and returns its body verbatim on success.

        This is a liveness probe only. It does **not** check the database or
        Cloudflare R2, so a `200` does not mean the API is fully functional.
      x-auth: none
      x-owner-check: not-applicable
      security: []
      responses:
        "200":
          description: Python engine reachable and healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineHealth"
        "503":
          description: Python engine unreachable, unhealthy, or the fetch threw.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HealthUnreachable"
                  - $ref: "#/components/schemas/HealthEngineDown"

  /api/auth/{...nextauth}:
    get:
      tags: [Authentication]
      operationId: nextAuthGet
      summary: NextAuth handler (GET) - session, CSRF token, provider metadata
      description: |
        The standard NextAuth v4 catch-all route (`app/api/auth/[...nextauth]/route.ts`).
        The file contains only `export { handler as GET, handler as POST }`, so
        this operation is whatever `NextAuth(authOptions)` installs in
        `lib/auth-options.ts`.

        Two providers are configured: **Google** (OAuth 2.0) and
        **Credentials** (email + password). Session strategy is `jwt`.

        The useful concrete paths are:

        | Path | Purpose | Typical result |
        | --- | --- | --- |
        | `/api/auth/providers` | List provider ids and callback URLs | `200` JSON |
        | `/api/auth/session` | Read the current session | `200` with `user: null` when signed out |
        | `/api/auth/csrf` | Fetch a CSRF token for client-side POSTs | `200` JSON |
        | `/api/auth/error` | Last sign-in error | `200` JSON or redirect |

        Sign-in posts to `/api/auth/callback/credentials` (password) or
        `/api/auth/signin/google` (OAuth start).
      x-auth: none
      x-owner-check: not-applicable
      security: []
      responses:
        "200":
          description: NextAuth response. Shape depends on the sub-path.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/NextAuthSession"
                  - $ref: "#/components/schemas/NextAuthProviders"
                  - $ref: "#/components/schemas/NextAuthCsrf"
                  - type: object
                    additionalProperties: true
        "302":
          description: Redirect to a NextAuth action page, or to the OAuth provider.
    post:
      tags: [Authentication]
      operationId: nextAuthPost
      summary: NextAuth handler (POST) - credentials sign-in, OAuth callback, sign-out
      description: |
        The write side of the same catch-all route. These are the concrete
        endpoints worth calling:

        | Path | Body | Effect |
        | --- | --- | --- |
        | `/api/auth/callback/credentials` | form: `csrfToken`, `email`, `password`, optional `callbackUrl`, optional `json=true` | Verifies against `profiles`, sets the session cookie, returns the session as JSON when `json=true`, otherwise redirects |
        | `/api/auth/callback/google` | query: `code`, `state` | Completes the OAuth handshake and sets the session cookie |
        | `/api/auth/signout` | form: `csrfToken` | Clears the session cookie |
        | `/api/auth/signin` | form: `csrfToken`, `callbackUrl` | Redirects to the provider selection page |

        Fetch the CSRF token from `/api/auth/csrf` first - the credentials
        callback rejects a missing or mismatched token.

        The credentials `authorize` callback in `lib/auth-options.ts` looks the
        profile up by lowercased email and, if the row has no `password` hash
        (a Google-only account), fails with an explicit "sign in with Google"
        message. It also throws the raw database error message on a query
        failure, which NextAuth surfaces on `/api/auth/error` - a minor
        information leak.

        **Prefer `POST /api/mobile/auth/login` for non-browser clients.** It
        returns the same identity in a Bearer JWT instead of a `Set-Cookie`
        that browsers will not store for a native app.
      x-auth: none
      x-owner-check: not-applicable
      security: []
      requestBody:
        required: false
        description: Form-encoded, as NextAuth v4 expects. `application/x-www-form-urlencoded`.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                csrfToken:
                  type: string
                  description: From `/api/auth/csrf`. Required for every mutating action.
                email:
                  type: string
                  format: email
                password:
                  type: string
                callbackUrl:
                  type: string
                  format: uri
                  description: Where to land after sign-in. Defaults to the configured `/login` page.
                json:
                  type: string
                  description: Set to `true` to receive the session as JSON instead of a redirect.
                redirect:
                  type: string
          application/json:
            schema:
              type: object
              properties:
                csrfToken:
                  type: string
                email:
                  type: string
                password:
                  type: string
                callbackUrl:
                  type: string
      responses:
        "200":
          description: Session established (or the sign-out acknowledgement) as JSON.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/NextAuthSession"
                  - type: object
                    additionalProperties: true
        "302":
          description: Redirect to `callbackUrl`, to `/login`, or to the Google consent screen. On success the `Set-Cookie` header carries the session token.
        "401":
          description: CSRF token missing or invalid, or the credentials were rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples: [MissingCSRF, "CredentialsSignin"]

  /api/auth/signup:
    post:
      tags: [Authentication]
      operationId: webSignup
      summary: Register an email/password account (no session cookie issued)
      description: |
        Creates a `profiles` row with `role: "user"` and a matching
        `user_credits` row at `0`. The password is hashed with the project's
        own `hashPassword` helper. **This endpoint does not sign the user in** -
        it returns only a `userId`; the caller must then go through
        `/api/auth/callback/credentials` to obtain a session.

        A missing `user_credits` row is upserted, so this is safe to retry for a
        brand-new user, but a duplicate email is a hard `400`.
      x-auth: none
      x-owner-check: not-applicable
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  description: Stored lowercased. Not format-validated by the server.
                password:
                  type: string
                  minLength: 6
                  description: Plaintext; hashed server-side.
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                required: [message, userId]
                properties:
                  message:
                    type: string
                    const: Registration successful
                  userId:
                    type: string
                    format: uuid
        "400":
          description: |
            Missing field, password shorter than 6 characters, or the email is
            already taken. If the existing account was created through Google
            the message explicitly says so. Note this route uses the `error`
            key, not `message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
              examples:
                googleAccountExists:
                  value:
                    error: "This email is already linked to a Google account. Please sign in with Google."
                passwordTooShort:
                  value:
                    error: "Password must be at least 6 characters long"
                duplicate:
                  value:
                    error: "User already exists with this email address"
        "500":
          $ref: "#/components/responses/ServerErrorMessage"

  /api/auth/user:
    get:
      tags: [Authentication]
      operationId: webGetCurrentUser
      summary: Read the current session user, profile, credits, and subscription flag
      description: |
        **Cookie-only.** Unlike every other protected route this calls
        `getServerSession(authOptions)` directly and ignores the
        `Authorization` header, so a mobile Bearer token will not work here.

        Never returns `401`. A signed-out caller gets `200` with
        `{ "user": null }`, so clients must check the `user` field rather than
        the status code.
      x-auth: session
      x-owner-check: self
      security:
        - nextAuthSession: []
      responses:
        "200":
          description: Session state. `user` is `null` when signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserEnvelope"
        "500":
          description: |
            Database failure. Unlike the signed-out case this one does use
            status `500`, but the body is still `{ "user": null }` rather than
            an error object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: "null"

  /api/mobile/auth/signup:
    post:
      tags: [Authentication]
      operationId: mobileSignup
      summary: Register an account and receive a 30-day mobile JWT
      description: |
        Mobile equivalent of `/api/auth/signup`, but the profile and credit
        rows are created inside a `prisma.$transaction` and a JWT is returned
        in the response body. No cookie is set.

        Unlike the web signup, this handler does not distinguish "email already
        registered with Google" from "email already registered with a
        password"; both collapse to `"User already exists"`.
      x-auth: none
      x-owner-check: not-applicable
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        "201":
          description: Account created and JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAuthResponse"
        "400":
          description: "Missing fields, password under 6 characters, or duplicate email."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "500":
          $ref: "#/components/responses/ServerErrorMessage"

  /api/mobile/auth/login:
    post:
      tags: [Authentication]
      operationId: mobileLogin
      summary: Exchange email/password for a 30-day mobile JWT
      description: |
        Verifies the password with `verifyPassword` and signs
        `{ id, email, role }` with `NEXTAUTH_SECRET` and `expiresIn: "30d"`.

        The response body is the **only** place the token appears; nothing is
        stored server-side, so there is no revocation path. See
        `known-gaps.md` for the fallback-secret risk.
      x-auth: none
      x-owner-check: not-applicable
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAuthResponse"
        "400":
          description: Missing email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "401":
          description: |
            Unknown email, wrong password, or the account was created through
            Google and therefore has no password hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "500":
          $ref: "#/components/responses/ServerErrorMessage"

  /api/mobile/auth/google:
    post:
      tags: [Authentication]
      operationId: mobileGoogleLogin
      summary: Exchange a Google ID token for a 30-day mobile JWT
      description: |
        Verifies the supplied Google ID token by calling
        `https://oauth2.googleapis.com/tokeninfo?id_token=...`, then finds the
        profile by the email Google returns (lowercased). If no profile exists
        it creates one with `role: "user"` and a `0`-credit row inside a
        transaction, with **no password** field.

        Note this is a live network call to Google on every request; the token
        is not cached or nonce-checked.
      x-auth: none
      x-owner-check: not-applicable
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: A Google OAuth ID token (the credential a native app receives).
      responses:
        "200":
          description: Authenticated; the account may have been created just now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAuthResponse"
        "400":
          description: '`idToken` missing, or Google''s tokeninfo response had no `email`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "401":
          description: Google's tokeninfo endpoint rejected the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "500":
          $ref: "#/components/responses/ServerErrorMessage"

  /api/users/role:
    post:
      tags: [Users]
      operationId: getUserRole
      summary: Read the caller's own role
      description: |
        Despite being a `POST` with no request body, this is a read: it returns
        `{ "role": "<role>" }` for the authenticated caller. Roles seen in the
        codebase are `user`, `astrologer`, `dev`, and `admin`.
      x-auth: session-or-bearer
      x-owner-check: self
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: The caller's role.
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role:
                    $ref: "#/components/schemas/UserRole"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "404":
          description: The JWT resolved to an id with no `profiles` row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: |
            Returns **both** `message` and the raw `error.message`. This leaks
            internal failure text to the client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List the caller's own projects
      description: |
        Scoped to `user_id = session.id` and `deleted_at IS NULL`, newest first.
        This is the one list endpoint that correctly enforces isolation.
      x-auth: session-or-bearer
      x-owner-check: self
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: The caller's projects.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "500":
          description: Returns `message` plus the raw `error.message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: |
        Creates the project and, if the authenticated id has no `profiles` row
        yet (which happens for Google sign-ins in some paths), lazily creates
        the profile and a `0`-credit row first.

        ## Server-side geometry validation

        When all four of `plot_side_front`, `plot_side_back`, `plot_side_left`,
        `plot_side_right` are supplied and positive, the server calls
        `feasibleDiagonalInterval(a, b, c, d)` and rejects the request unless:

        * the four sides can form a quadrilateral, and
        * if `plot_diagonal` was also supplied, it lies **strictly** between
          `interval.min` and `interval.max`.

        The error message for the diagonal case embeds the computed bounds, so
        the UI can show the user a concrete range. If any side is omitted the
        whole check is skipped, so a plot with three sides is accepted
        unvalidated.

        `astrologer_code` and `expert_code` are aliases; the first non-empty one
        is looked up in `profiles.expert_code` and, on a hit, sets
        `assigned_astrologer_id`. An unknown code is **silently ignored** - the
        project is still created, just unassigned. There is no way to clear an
        existing assignment through this endpoint.
      x-auth: session-or-bearer
      x-owner-check: self
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                type: object
                required: [message, project]
                properties:
                  message:
                    type: string
                    const: Project created successfully
                  project:
                    $ref: "#/components/schemas/Project"
        "400":
          description: |
            `name` missing, a side length non-positive, the four sides cannot
            form a quadrilateral, or `plot_diagonal` outside the feasible range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                nameRequired:
                  value:
                    message: Name is required
                notAQuadrilateral:
                  value:
                    message: "Invalid plot: these four sides cannot form a quadrilateral. Adjust the side lengths."
                diagonalOutOfRange:
                  value:
                    message: "Invalid diagonal: must be strictly between 3.35 and 8.11 (FL-BR diagonal)."
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "500":
          description: Returns `message` plus the raw `error.message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      operationId: getProject
      summary: Read one project with its objects, media URLs, and premium flag
      description: |
        Filters on `id` **and** `user_id`, so a project owned by somebody else
        returns `404` rather than `403` - which is the right behaviour for
        avoiding an existence oracle.

        Response is the raw `projects` row spread with three added keys:

        | Key | Meaning |
        | --- | --- |
        | `floor_plan_path` | Presigned R2 URL for the active map plot, valid 1 hour, or `null` |
        | `video_url` | Presigned R2 URL for the plot video, valid 1 hour, or `null` |
        | `placed_objects` | Duplicate of the selected `project_objects` projection |
        | `is_premium` | `true` if any analysis on the project has `report_paid`, **or** `checkPaymentAccess` passed |

        `is_premium` is a hint for UI gating only. The real gates are the
        `403`s on `/api/analysis/marma`, `/api/analysis/full-report` and
        `/api/analysis/{analysisId}/deduct-credit-for-report`.

        Note that R2 presigning is wrapped in its own `try/catch`, so a storage
        outage degrades the two URL fields to `null` while still returning `200`.
      x-auth: session-or-bearer
      x-owner-check: owner
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    allOf:
                      - $ref: "#/components/schemas/Project"
                      - type: object
                        properties:
                          floor_plan_path:
                            type: [string, "null"]
                            description: Presigned URL, 1 hour TTL.
                          video_url:
                            type: [string, "null"]
                            description: Presigned URL, 1 hour TTL.
                          placed_objects:
                            type: array
                            items:
                              $ref: "#/components/schemas/PlacedObjectSummary"
                          is_premium:
                            type: boolean
        "400":
          description: Empty `projectId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "404":
          description: No project with that id **for this user**.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "500":
          description: 'Body is `{ error: error.message }` - raw internal text.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"

    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update selected project fields
      description: |
        A whitelist of thirteen fields is copied into an `updates` object:
        `boundary_normalized`, `north_direction`, `plot_width`, `plot_height`,
        the five `plot_side_*` / `plot_diagonal` measurements,
        `assigned_astrologer_id`, `status`, and `metadata`. Any other key in the
        body - including `user_id`, `id`, `deleted_at`, `expert_id` - is
        ignored, so this is not a mass-assignment hole.

        Setting `status: "completed"` also stamps `completed_at`. If no
        whitelisted key is present the request is rejected with `400`.

        Unlike the read, **this handler does not filter by `user_id`.** It
        updates `where: { id: projectId }` only. See `known-gaps.md`.
      x-auth: session-or-bearer
      x-owner-check: none
      x-known-issues:
        - id: IDOR-PATCH-PROJECT
          severity: high
          summary: Any authenticated user can modify any project by id, including reassigning it to an astrologer.
          detail: |-
            `prisma.projects.update({ where: { id: projectId } })` has no
            `user_id` filter, so ownership is never verified. The accepted keys
            include `assigned_astrologer_id` (a raw id, with no check that the
            target even has the astrologer role) and the full plot geometry, so
            one request can reshape another user's plot and redirect it to a
            different astrologer. `status: "completed"` also stamps
            `completed_at`.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated.
          content:
            application/json:
              schema:
                type: object
                required: [message, project]
                properties:
                  message:
                    type: string
                    const: Project updated successfully
                  project:
                    $ref: "#/components/schemas/Project"
        "400":
          description: Body contained none of the whitelisted fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "404":
          description: Prisma `P2025` - no row with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "500":
          description: 'Body is `{ error: error.message }`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"

    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project and all of its media and analyses
      description: |
        The only mutating project route that checks ownership: it reads
        `user_id` and returns `404` when it does not match.

        Teardown order, all **outside** any transaction:

        1. Delete every `map_plots.storage_path` and `video_path` object from R2
           (failures are logged and swallowed).
        2. `projects.update({ active_map_plot_id: null })` to break the
           circular relation.
        3. `map_plots.deleteMany({ project_id })`.
        4. `projects.delete({ id })`, which cascades to `analyses` and
           `project_objects`.

        Because there is no transaction, a failure between steps 2 and 4
        leaves orphaned rows. Step 2 also permanently clears the project's
        active map plot.
      x-auth: session-or-bearer
      x-owner-check: owner
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: Project, its analyses, its objects, and its media are gone.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    const: Project and all related data deleted successfully
        "400":
          description: Empty `projectId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "404":
          description: "Missing project, or `user_id` mismatch. Both collapse to the same message."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "500":
          description: Returns `error` plus `details` carrying the raw message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAndDetails"

  /api/projects/{projectId}/objects:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Floor Plan Objects]
      operationId: listProjectObjects
      summary: List every placed object on a project
      description: |
        Returns full rows, including `marma_distance` and `issues`.

        **No ownership check.** The query filters on `project_id` alone, so any
        authenticated caller can read the object layout of any project id they
        can guess or enumerate.
      x-auth: session-or-bearer
      x-owner-check: none
      x-known-issues:
        - id: IDOR-LIST-OBJECTS
          severity: high
          summary: No ownership check on projectId, so any authenticated user can read any project's floor plan layout.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: All objects on the project. Empty array if none.
          content:
            application/json:
              schema:
                type: object
                required: [objects]
                properties:
                  objects:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectObject"
        "400":
          description: Empty `projectId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "500":
          description: Returns `error` plus `details`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAndDetails"

    post:
      tags: [Floor Plan Objects]
      operationId: replaceProjectObjects
      summary: Replace the entire object set for a project
      description: |
        This is a **destructive replace, not an append.**

        1. `deleteMany({ project_id: projectId })` - every existing object is
           removed.
        2. If the new `objects` array is empty, return `200` with
           `{ "message": "No objects to insert", "objects": [] }`. The project
           has already been emptied at this point.
        3. `createMany` the incoming objects, then re-read them so the response
           includes the generated `id`s.

        The delete and the insert are **not** in a transaction, so an insert
        failure leaves the project with no objects at all. Only
        `object_type`, `boundary_normalized`, and `centroid` are persisted from
        each element; `id`, `type`, and `zone` are dropped, and `marma_distance`
        / `issues` are never written by this route.

        An `objects` array that is empty passes validation. The `deleteMany` has
        already run by then, so `{"objects": []}` clears the floor plan and
        responds `200 {"message": "No objects to insert", "objects": []}`.

        No ownership check.
      x-auth: session-or-bearer
      x-owner-check: none
      x-known-issues:
        - id: IDOR-REPLACE-OBJECTS
          severity: high
          summary: No ownership check; any authenticated user can wipe another user's floor plan.
        - id: NONATOMIC-REPLACE
          severity: medium
          summary: Delete-then-insert is not transactional, so a failed insert leaves the project empty.
        - id: EMPTY-ARRAY-WIPES-PLAN
          severity: medium
          summary: Sending an empty `objects` array deletes every object for the project and still returns 200.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objects]
              properties:
                objects:
                  type: array
                  description: The complete replacement set. Passing `[]` clears the project.
                  items:
                    $ref: "#/components/schemas/ReplaceObjectInput"
      responses:
        "200":
          description: |
            Replaced. Either `"Objects saved successfully"` with the new rows,
            or `"No objects to insert"` when an empty array cleared the project.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [message, objects]
                    properties:
                      message:
                        type: string
                        const: Objects saved successfully
                      objects:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProjectObject"
                  - type: object
                    required: [message, objects]
                    properties:
                      message:
                        type: string
                        const: No objects to insert
                      objects:
                        type: array
                        maxItems: 0
                        items:
                          type: "null"
        "400":
          description: "`objects` was missing or not an array."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "500":
          description: Returns `error` plus `details`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAndDetails"

  /api/projects/{projectId}/objects/{objectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ObjectId"
    put:
      tags: [Floor Plan Objects]
      operationId: updateProjectObject
      summary: Update one placed object (or move it to another zone)
      description: |
        Ownership **is** verified here: the project is looked up with
        `id` + `user_id` and a miss returns `404`. The update itself is scoped
        to `id` + `project_id`, so an object id from a different project will
        not be touched.

        ## Field naming quirk

        The body is destructured as `{ type, zone, ...restObjectData }` and the
        update is written as `{ ...restObjectData, object_type: type }`. So:

        * the type must be sent as **`type`**, not `object_type`;
        * `zone` is accepted and silently discarded;
        * every other key is spread **directly into the Prisma update** after
          `type` and `zone` are removed. That includes `object_type` - if you
          send both, `type` wins because it is applied last.
        * `id` is not excluded, so sending `id` in the body attempts to change
          the primary key and will fail the query.

        This route is also the one that breaks browser CORS, because `PUT` is
        not in the allow-list. See `cors.md`.
      x-auth: session-or-bearer
      x-owner-check: owner
      x-known-issues:
        - id: CORS-PUT-MISSING
          severity: medium
          summary: Browser preflight fails because `PUT` is absent from Access-Control-Allow-Methods.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateObjectRequest"
      responses:
        "200":
          description: Object updated; the full row is returned.
          content:
            application/json:
              schema:
                type: object
                required: [message, object]
                properties:
                  message:
                    type: string
                    const: Project object updated successfully
                  object:
                    $ref: "#/components/schemas/ProjectObject"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "404":
          description: "Project not owned by the caller, or the object id is not in that project."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                notYourProject:
                  value:
                    message: "Project not found or you do not have permission to modify objects in it."
                noSuchObject:
                  value:
                    message: Object not found
        "500":
          description: Returns `message` plus the raw `error.message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

    delete:
      tags: [Floor Plan Objects]
      operationId: deleteProjectObject
      summary: Delete one placed object
      description: |
        Ownership **is** verified, and the delete is scoped to
        `id` + `project_id`. Deleting an object that belongs to a different
        project leaves it untouched and returns `404`.
      x-auth: session-or-bearer
      x-owner-check: owner
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    const: Project object deleted successfully
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "404":
          description: "Project not owned by the caller, or the object is not in that project."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Returns `message` plus the raw `error.message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/projects/{projectId}/objects/batch:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Floor Plan Objects]
      operationId: batchProjectObjects
      summary: Create and delete many objects in one call
      description: |
        Two optional arrays, applied in a fixed order:

        1. `objectsToDelete` - `deleteMany({ id: { in: objectsToDelete } })`.
        2. `objectsToSave` - `createMany`. Each element's `id` and `zone` are
           stripped and its `type` is mapped to `object_type`, so a saved
           element is the same shape as `UpdateObjectRequest`.

        The response is the **full re-read** of the project's objects after the
        mutation, so a client can use it as an authoritative sync. Both arrays
        may be omitted or empty, in which case this is a read that re-writes
        nothing.

        The project ownership check is present and correct. **The delete is not
        project-scoped**: `objectsToDelete` is matched by id alone, so an
        authenticated astrologer or admin who owns one project can also delete
        objects belonging to other projects by passing their ids.

        Note this route lives at `.../objects/batch`, which collides with the
        `[objectId]` dynamic segment. Next.js gives the static segment priority,
        so `POST .../objects/batch` always reaches this handler. Because
        `[objectId]` only serves `PUT` and `DELETE`, there is no practical
        ambiguity - but do not try to create an object whose id is `batch`.

        No client in this repository calls this endpoint.
      x-auth: session-or-bearer
      x-owner-check: project-only
      x-known-issues:
        - id: BATCH-DELETE-NOT-SCOPED
          severity: medium
          summary: objectToDelete ids are not filtered by project_id, so ids from other projects can be deleted.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objectsToSave:
                  type: array
                  items:
                    $ref: "#/components/schemas/UpdateObjectRequest"
                objectsToDelete:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Saved, then the full post-mutation object list re-read.
          content:
            application/json:
              schema:
                type: object
                required: [message, objects]
                properties:
                  message:
                    type: string
                    const: Configuration saved successfully
                  objects:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectObject"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "404":
          description: Project missing or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: |
            Three distinct failure shapes are possible, distinguished by
            `message`: `"Failed to delete objects."`,
            `"Failed to save new objects."`, or
            `"Objects saved, but failed to fetch updated list."`. Each also
            carries the raw `error` message. The third case means the write
            succeeded and only the re-read failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/projects/{projectId}/video:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Uploads]
      operationId: uploadProjectVideo
      summary: Upload and compress a plot video, then point the project at it
      description: |
        `multipart/form-data` with a single `file` part.

        Size handling:

        * over **100 MB** is rejected with `400`;
        * over **10 MB** is re-encoded with ffmpeg (`libx264`, `aac`) to a
          computed bitrate targeting 9 MB, with a 200 kbps floor;
        * the buffer is written to `os.tmpdir()` and read back, so the
          serverless function needs writable temp space and enough memory for
          the whole file.

        On success the object is stored at
        `videos/{userId}/{projectId}/{timestamp}_{filename}` and the project's
        `video_path` is set. **Any previous video is orphaned in R2** - the old
        key is overwritten in the database but never deleted, and it is
        removed only when the project itself is deleted.

        Uploading again replaces `video_path`; there is no history and no
        per-project video cap.

        No ownership check, and the content type is taken from the client's
        `file.type` with no allow-list, so this endpoint will accept any
        bytes up to 100 MB. `ffprobe` failures fall back to storing the
        original file uncompressed.
      x-auth: session-or-bearer
      x-owner-check: none
      x-known-issues:
        - id: IDOR-VIDEO-UPLOAD
          severity: high
          summary: No ownership check; any authenticated user can overwrite any project's video_path.
        - id: UNRESTRICTED-VIDEO-TYPE
          severity: high
          summary: >-
            No MIME allow-list and no content sniffing, so up to 100 MB of arbitrary bytes can be
            stored. The client-supplied file.type is stored as the object's Content-Type and
            replayed by /api/public-assets, so an HTML or SVG "video" is served as text/html from
            the app's origin. file.name is also used unescaped in the R2 key and the ffmpeg temp
            path.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Video, hard limit 100 MB.
      responses:
        "200":
          description: Stored in R2 and linked from the project.
          content:
            application/json:
              schema:
                type: object
                required: [message, project]
                properties:
                  message:
                    type: string
                    const: Video uploaded and project updated successfully
                  project:
                    $ref: "#/components/schemas/Project"
        "400":
          description: No `file` part, or the file exceeds 100 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "500":
          description: "R2 upload failure, Prisma update failure, or an unexpected error. Each includes the raw `error` message."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/public-assets/{...key}:
    parameters:
      - $ref: "#/components/parameters/AssetKey"
    get:
      tags: [Uploads]
      operationId: getPublicAsset
      summary: Stream a public R2 object by key
      description: |
        A **completely unauthenticated** catch-all that joins the path segments
        back into an R2 key and streams the object back. It sets
        `Cache-Control: public, max-age=31536000, immutable`.

        Because there is no allow-list of prefixes, *any* key readable by the
        R2 credentials is publicly fetchable, including
        `map-plots/{userId}/...` and `videos/{userId}/...` - i.e. the private
        floor plans and videos that the presigned-URL routes above were
        designed to protect. If you intend this route for genuinely public
        assets, restrict it to a fixed prefix such as `public/`.

        Errors are `text/plain`, not JSON.
      x-auth: none
      x-owner-check: none
      x-known-issues:
        - id: PUBLIC-ASSET-LEAK
          severity: critical
          summary: Unauthenticated catch-all exposes every R2 object, including private floor plans and videos.
        - id: PUBLIC-ASSET-NO-PREFIX-ALLOWLIST
          severity: high
          summary: >-
            The catch-all key is not restricted to a known prefix, so it will serve any object in
            the bucket, and there is no signature or expiry check of any kind.
        - id: PUBLIC-ASSET-CONTENT-TYPE-REPLAY
          severity: high
          summary: >-
            The stored Content-Type is replayed to the caller, so an upload of attacker-chosen
            type is served from the app's own origin. Combined with the missing upload allow-list
            this is stored XSS. The response also sets Cache-Control: immutable for a year, so a
            replaced object is never revalidated by browsers or CDNs.
      security: []
      responses:
        "200":
          description: The object's bytes, streamed.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Empty key.
          content:
            text/plain:
              schema:
                type: string
                const: Key required
        "404":
          description: The key does not exist, or the R2 lookup threw.
          content:
            text/plain:
              schema:
                type: string
                const: Asset not found

  /api/upload:
    post:
      tags: [Uploads]
      operationId: uploadFloorPlan
      summary: Upload a floor-plan image and activate it on the project
      description: |
        `multipart/form-data` with a `file` part and a `projectId` field.
        Max **5 MB**.

        ## Payment gate

        Upload is refused with `403` unless the caller is `admin` or
        `astrologer`, or has a `user_subscriptions` row with status
        `active`/`trialing` and `expires_at > now`, or has at least one credit.
        Note this is a plain `credits > 0` check - it does **not** consume a
        credit, so repeated uploads on one credit are possible until the
        subscription expires or the credit balance reaches zero.

        ## Re-upload cap

        `map_plots.count({ project_id }) >= 2` returns `403` for non-staff. The
        new row is inserted and becomes active; **the previous map plot rows
        are only deactivated (`is_active = false`), never deleted**, so their
        R2 objects stay until the project is deleted. The count keeps growing
        across attempts, so the cap is two uploads per project per account
        lifetime.

        No ownership check on `projectId`.
      x-auth: session-or-bearer
      x-owner-check: none
      x-known-issues:
        - id: IDOR-MAP-UPLOAD
          severity: high
          summary: No ownership check on projectId; a paying user can attach a map plot to somebody else's project.
        - id: UPLOAD-TYPE-UNVALIDATED
          severity: high
          summary: >-
            file.type is stored verbatim as the object's Content-Type with no allow-list and no
            content sniffing, so an SVG or HTML floor plan is stored and later served as
            text/html by /api/public-assets. Combined with that route this is stored XSS on the
            app's own origin.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, projectId]
              properties:
                file:
                  type: string
                  format: binary
                  description: Floor-plan image, max 5 MB. No MIME allow-list.
                projectId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Stored in R2, inserted as an active `map_plots` row, and linked as the project's active map plot.
          content:
            application/json:
              schema:
                type: object
                required: [message, project]
                properties:
                  message:
                    type: string
                    const: File uploaded and project updated successfully
                  project:
                    $ref: "#/components/schemas/Project"
        "400":
          description: No `file`, no `projectId`, or the file exceeds 5 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "403":
          description: |
            Either no paid access, or the two-upload cap is already reached.
            The two cases are distinguishable by message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                noPaidAccess:
                  value:
                    message: "Map Upload is restricted to Basic (Rs.999+GST) and Advanced (Rs.2500+GST) plans. Free tier allows manual plot entry only."
                reuploadCap:
                  value:
                    message: "Maximum upload limit reached. You can only re-upload once."
        "500":
          description: "R2 upload, deactivation, insert, or project-update failure. Each includes the raw `error` message."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/analysis:
    post:
      tags: [Analysis]
      operationId: createAnalysis
      summary: Create a pending analysis for a project
      description: |
        Inserts an `analyses` row with `status: "pending"`, the supplied
        `boundary_normalized` and `north_direction`, and `report_paid: false`.
        Returns the new `analysisId` only.

        ## Role handling

        `admin`, `astrologer`, and `user` are all allowed. For `admin` and
        `astrologer` the project-ownership check is **skipped**, so those roles
        can create analyses on any project id. For `user` the project's
        `user_id` must match.

        Because all three roles are in the allow-list, the `403` with
        `needs_payment: true` is currently unreachable for any role present in
        the database.

        ## Date validation

        `analysisDate` must match `YYYY-MM-DD` and `analysisTime`, if present,
        `HH:MM`. The combined timestamp must parse and must **not be in the
        future**. A date-only value is treated as `T00:00:00` local time and
        stored as an ISO-8601 string. Both are optional; when `analysisDate` is
        absent the stored `analysis_timestamp` is `null`.
      x-auth: session-or-bearer
      x-owner-check: owner-for-users-only
      x-known-issues:
        - id: ANALYSIS-ROLE-GATE
          severity: low
          summary: >-
            The role allow-list is a hard-coded `role === "admin" || "astrologer" || "user"`, so the
            `dev` role is refused with 403 `{ message, needs_payment: true }` - a payment prompt for
            a role that has nothing to do with payment. Conversely astrologer and admin skip the
            project-ownership check entirely and may analyse any project id, which is presumably
            intended but is not expressed anywhere in the code.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalysisRequest"
      responses:
        "201":
          description: Analysis row created in `pending` state.
          content:
            application/json:
              schema:
                type: object
                required: [message, analysisId]
                properties:
                  message:
                    type: string
                    const: Analysis created successfully
                  analysisId:
                    type: string
                    format: uuid
        "400":
          description: "Missing `projectId`, `analysisType`, `boundary_normalized`, or `north_direction`; or a malformed/future date."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                missingFields:
                  value:
                    message: "Project ID, analysis type, boundary, and north direction are required."
                badDateFormat:
                  value:
                    message: "Invalid analysisDate format. Expected YYYY-MM-DD."
                futureDate:
                  value:
                    message: "Analysis date and time cannot be in the future."
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "403":
          description: 'The project belongs to another user. Body also carries `needs_payment: true`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsPayment"
        "404":
          description: No project with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: "Profile lookup or insert failure. Returns `message` plus the raw `error.message`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/analysis/objects:
    post:
      tags: [Analysis]
      operationId: analyzeObjectsUnauthenticated
      summary: Unauthenticated proxy to the Python object analysis engine
      description: |
        Forwards the body verbatim to `{MICROSERVICE_URL}/analyze_objects` and
        returns the engine's response unchanged. On a non-2xx engine reply the
        status is mirrored and the body becomes
        `{ "error": <engine detail> }`.

        **This route has no authentication and no payment check.** The full
        Vastu scoring engine is therefore callable by anyone who can reach the
        site, with no per-object rate limit. It does not read or write the
        database, so the practical exposure is compute, not data - but it
        completely bypasses the credit model that
        `/api/analysis/[analysisId]/deduct-credit-for-report` enforces.

        Note the path collides with the `[analysisId]` dynamic segment: Next.js
        matches the static `objects` first, so this handler always wins for
        `POST /api/analysis/objects`.
      x-auth: none
      x-owner-check: not-applicable
      x-known-issues:
        - id: UNAUTH-ANALYSIS-PROXY
          severity: high
          summary: No auth and no payment gate on the full analysis engine.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectAnalysisRequest"
      responses:
        "200":
          description: Engine result, passed through untouched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VastuAnalysisResult"
        "422":
          description: 'Pydantic validation failure inside the engine; the body is `{ error: <detail> }`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: The fetch to the engine threw.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
                description: >
                  The handler always returns the literal string
                  "Internal Server Error during object analysis" in `error`.

  /api/analysis/devta:
    get:
      tags: [Analysis]
      operationId: getDevtaAnalysis
      summary: Generate the 45-devta and direction-zone geometry for an analysis
      description: |
        Loads `boundary_normalized` and `north_direction` from the `analyses`
        row identified by the `analysisId` query parameter, health-checks the
        Python engine, then POSTs to `/analyze` with
        `{ boundary_normalized, north_direction, grid_type }`.

        `gridType` defaults to `"81"` and is passed straight through as
        `grid_type`; the engine only accepts `"81"` or `"64"`, so any other
        value yields a `422` from the engine, which this route flattens into a
        generic `500`.

        ## Premium filtering

        If the caller is not premium (no `report_paid` analysis on the project
        and `checkPaymentAccess` failed), the response is still `200` but
        **`devtas45` is overwritten with an empty array**. The 16 and 8 zone
        geometry is still returned in full, so a free caller sees the zone
        overlay without the devta mandala.

        ## Side effect

        On a successful engine call the route sets the analysis `status` to
        `"reviewed"`. That update is in its own `try/catch`, so a failure is
        logged and the response is still returned. Combined with the missing
        ownership check below, any authenticated user can mark any analysis
        reviewed just by calling this.

        No ownership check: the `analyses` lookup is `findUnique({ id })` and
        the project owner is never compared against the caller.
      x-auth: session-or-bearer
      x-owner-check: none
      x-known-issues:
        - id: IDOR-DEVTA
          severity: high
          summary: No ownership check, so any authenticated user can run (and mark reviewed) another user's analysis.
        - id: GET-WRITES-STATE
          severity: medium
          summary: >-
            This GET mutates: after producing the grid it issues
            `prisma.analyses.update({ data: { status: "reviewed" } })` and swallows any failure into
            a log line, so a GET can silently mark an analysis reviewed - including one belonging to
            another user - and a 200 response does not mean the write happened.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      parameters:
        - $ref: "#/components/parameters/AnalysisIdQuery"
        - $ref: "#/components/parameters/GridTypeQuery"
      responses:
        "200":
          description: Geometry from the Python engine. `devtas45` is `[]` for non-premium callers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisGeometry"
        "400":
          description: "`analysisId` query parameter absent, or the stored analysis has no boundary or a `null` north direction."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "404":
          description: No analysis with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: |
            The engine health check failed, the engine returned non-2xx, the
            caller has no `profiles` row, or an unexpected error occurred.

            Four distinct messages collapse into this response: three use the
            `error` key (`"Python Service Unreachable"`, `"Python Service
            Unreachable or error during analysis"`, `"Internal Server Error"`)
            and one uses `message` (`"Failed to fetch user profile."`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorMessageField"
                  - $ref: "#/components/schemas/ErrorMessage"

  /api/analysis/full-report:
    get:
      tags: [Analysis]
      operationId: getFullReport
      summary: Score every placed object and return the full report payload
      description: |
        ## Gates, in order

        1. If the caller's role is `user` and the analysis is not
           `report_paid`, return `403` - report access must be bought first via
           `/api/analysis/{analysisId}/deduct-credit-for-report`.
        2. The project must belong to the caller, or the caller must be
           `admin`. This check is present and correct.

        ## Engine call

        Boundary and north direction are taken from the **analysis** row, with
        the **project** row as a fallback (`analysis.north_direction ?? project.north_direction ?? 0`).
        `placed_objects` is projected down to
        `id, object_type, boundary_normalized, centroid` and POSTed to
        `/analyze_objects`.

        The response is the engine body spread together with the resolved
        `north_direction` and `boundary_normalized`, so the caller can confirm
        which geometry was actually analysed.

        `admin` and `astrologer` skip gate 1, so staff read reports for free.
      x-auth: session-or-bearer
      x-owner-check: owner-or-admin
      security:
        - bearerAuth: []
        - nextAuthSession: []
      parameters:
        - $ref: "#/components/parameters/AnalysisIdQuery"
      responses:
        "200":
          description: Full report from the engine plus the resolved geometry.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/VastuAnalysisResult"
                  - type: object
                    properties:
                      north_direction:
                        type: number
                        format: double
                      boundary_normalized:
                        $ref: "#/components/schemas/PointList"
        "400":
          description: "`analysisId` absent, or the resolved geometry is unusable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "403":
          description: "Role is `user` and the report has not been paid for."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: No analysis, or the project is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: "The engine replied non-2xx (body becomes `{ error, details }`), the caller has no profile row, or an unexpected error."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorAndDetails"
                  - $ref: "#/components/schemas/ErrorMessage"

  /api/analysis/marma:
    get:
      tags: [Analysis]
      operationId: getMarmaAnalysis
      summary: Marma (vital points) and Vansha lines for the project's plot
      description: |
        Computed **in-process** with `getMarmaPoints(project.boundary_normalized)`
        (`lib/marmaAnalysis.ts`) - this route makes no network call, unlike the
        other analysis routes.

        The engine lays a traditional Manduka 8x8 grid over the plot's bounding
        box, clips 25 orthogonal and diagonal Vansha lines to the boundary, and
        returns the up-to-14 named Marma intersections that fall inside the
        polygon. The route is called without the optional `centroid`
        argument, so the grid is centred on the **bounding box**, not the
        polygon centroid.

        Ownership is verified (project `user_id` must match, `admin` bypasses),
        and premium is **required**: no paid analysis on the project and a
        failed `checkPaymentAccess` returns `403`. Unlike `/api/analysis/devta`,
        the free-tier result is a hard refusal rather than a stripped payload.
      x-auth: session-or-bearer
      x-owner-check: owner-or-admin
      security:
        - bearerAuth: []
        - nextAuthSession: []
      parameters:
        - $ref: "#/components/parameters/AnalysisIdQuery"
      responses:
        "200":
          description: Marma points and clipped Vansha line segments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarmaResult"
        "400":
          description: "`analysisId` absent, or the project has no `boundary_normalized`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "403":
          description: Premium required. Unlike `devta`, the non-premium payload is not returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: No analysis, or the project is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/analysis/{analysisId}/status:
    parameters:
      - $ref: "#/components/parameters/AnalysisIdPath"
    get:
      tags: [Analysis]
      operationId: getAnalysisStatus
      summary: Read one analysis's status string
      description: |
        Returns `{ "status": "<status>" }`. If the stored status is falsy it
        reports `"completed"` instead, so a `null` status is never surfaced.

        Statuses seen in the codebase: `pending`, `reviewed`, `failed`, and the
        Prisma default `completed`.

        **No ownership check** - the lookup is `findUnique({ id })`, so any
        authenticated user can poll any analysis id. Prefer
        `/api/projects/{projectId}` for anything user-facing.
      x-auth: session-or-bearer
      x-owner-check: none
      x-known-issues:
        - id: IDOR-ANALYSIS-STATUS
          severity: low
          summary: Status of any analysis id is readable by any authenticated user.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: The analysis status.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    examples: [pending, reviewed, completed, failed]
        "400":
          description: Empty `analysisId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "404":
          description: No analysis with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          $ref: "#/components/responses/ServerErrorMessage"

  /api/analysis/{analysisId}/approve:
    parameters:
      - $ref: "#/components/parameters/AnalysisIdPath"
    put:
      tags: [Analysis]
      operationId: approveAnalysis
      summary: Mark an analysis reviewed (astrologer or dev only)
      description: |
        Requires the caller's `profiles.role` to be `astrologer` or `dev`;
        `admin` is **not** accepted here even though admins can read reports.
        Sets `status: "reviewed"` and returns the full row.

        This is the only analysis route that gates on role, and it is the right
        place to look for the reviewer workflow. There is no ownership or
        assignment check: any astrologer can approve any analysis, including
        analyses on projects assigned to a different astrologer.

        `PUT` is not in the CORS method allow-list, so this call fails
        preflight from a browser on a non-allow-listed origin.
      x-auth: session-or-bearer
      x-owner-check: none
      x-known-issues:
        - id: APPROVE-NO-ASSIGNMENT-CHECK
          severity: medium
          summary: >-
            Any astrologer or dev can approve any analysis by id: the update is
            `prisma.analyses.update({ where: { id: analysisId } })` with no ownership or
            assignment filter, and a non-existent id surfaces as a 500 rather than a 404 because
            the Prisma P2025 error is caught by the generic handler.
        - id: CORS-PUT-MISSING
          severity: medium
          summary: '`PUT` absent from Access-Control-Allow-Methods, so browser preflight fails.'
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                required: [message, analysis]
                properties:
                  message:
                    type: string
                    const: Analysis approved successfully
                  analysis:
                    $ref: "#/components/schemas/Analysis"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "403":
          description: Role is not `astrologer` or `dev`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Prisma failure. Returns `message` plus the raw `error.message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/analysis/{analysisId}/deduct-credit-for-report:
    parameters:
      - $ref: "#/components/parameters/AnalysisIdPath"
    post:
      tags: [Analysis]
      operationId: unlockReport
      summary: Spend one credit (or a subscription) to unlock a report
      description: |
        The paywall for `/api/analysis/full-report`. Takes no request body.

        ## Branch 1 - `admin` or `checkPaymentAccess` passed

        Admins, astrologers with an in-window `valid_from`/`valid_to`,
        subscribers with an unexpired `active`/`trialing` row, and anyone with
        at least one credit all take this path. It sets `report_paid = true` and
        returns `200` with `no_credit_deduction: true`. **No credit is
        consumed**, which is correct for subscriptions but means a
        single-credit user can unlock every report they can reach without ever
        dropping to zero.

        ## Branch 2 - free tier with exactly 0 credits

        `deductCredit` performs an atomic `updateMany` guarded by
        `credits >= 1`, so concurrent calls cannot overdraw. On success
        `report_paid` is set to `true`. If that write then fails, the route
        **refunds the credit** and returns `500` with a message saying so.

        Other outcomes: already unlocked returns `200` with
        `"Report already paid for."`; `status === "failed"` returns `403`; a
        missing analysis returns `404`.

        **No ownership check.** The analysis is looked up by id alone, and the
        credit is spent from the *caller's* balance. A user with one credit can
        therefore set `report_paid = true` on somebody else's analysis, after
        which the owner can read it and the caller's credit is gone.
      x-auth: session-or-bearer
      x-owner-check: none
      x-known-issues:
        - id: IDOR-UNLOCK-REPORT
          severity: high
          summary: Any user can spend their own credit to unlock another user's report.
        - id: NO-CREDIT-CONSUMPTION-WITH-CREDITS
          severity: high
          summary: >-
            Credits are never actually spent. checkPaymentAccess() returns hasAccess: true whenever
            user_credits.credits > 0, and the first branch of this handler reads hasAccess as
            "skip payment and set report_paid": true. A caller holding one or more credits therefore
            unlocks reports for free and keeps the credits, and the deductCredit() call below is
            reachable only for a caller with exactly zero credits - who then fails it and receives
            the 403. The insufficient-credits 403 is thus reachable only by users who have no
            credits at all.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: Report unlocked. Four distinct success bodies.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [message, no_credit_deduction]
                    properties:
                      message:
                        type: string
                        const: Report access granted.
                      no_credit_deduction:
                        type: boolean
                        const: true
                  - type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        const: Report already paid for.
                  - type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        const: Credit deducted and report access granted.
        "400":
          description: Empty `analysisId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "403":
          description: 'The analysis failed, or the caller has no credits. The latter body also carries `needs_payment: true`.'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorMessage"
                  - $ref: "#/components/schemas/NeedsPayment"
        "404":
          description: No analysis with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: "Profile lookup failure, or the unlock write failed after a successful deduction (in which case the credit is refunded)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/payments:
    get:
      tags: [Payments]
      operationId: listPlans
      summary: List active plans
      description: |
        **Unauthenticated.** Returns every `is_active` plan ordered by
        `price_inr`, split three ways:

        * `allPlans` - everything, cheapest first;
        * `creditPlans` - `plan_type` of `credit` **or** `free`;
        * `subscriptionPlans` - `plan_type` of `subscription`.

        The `free` grouping means free-tier rows are advertised alongside paid
        credit packs. `price_inr` is pre-GST; the price actually charged is
        `round(price_inr * 1.18)`, with a special case that leaves a
        `price_inr` of `1` at `1` (that is the Razorpay test order).

        The three hard-coded `CREDIT_PACKAGES` in `lib/razorpay.ts`
        (`credits_1rs`, `basic_plan`, `advanced_plan`) are **not** returned
        here unless matching rows exist in `subscription_plans`. Clients that
        hard-code those ids will not find them in this list.
      x-auth: none
      x-owner-check: not-applicable
      security: []
      responses:
        "200":
          description: Active plans, grouped.
          content:
            application/json:
              schema:
                type: object
                required: [allPlans, creditPlans, subscriptionPlans]
                properties:
                  allPlans:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionPlan"
                  creditPlans:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionPlan"
                  subscriptionPlans:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionPlan"
        "500":
          description: Database failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"

    post:
      tags: [Payments]
      operationId: createRazorpayOrder
      summary: Create (or reuse) a Razorpay order
      description: |
        Accepts either `planId` or the legacy `packageId`; `planId` wins if
        both are present. `targetPlanId` may be a plan UUID or a plan **name**
        (case-insensitive).

        ## Resolution order

        1. **Database plan** - match on UUID (only if it looks like one) or
           name, where `is_active` is true.
        2. **Hard-coded package** - match `targetPlanId` against
           `CREDIT_PACKAGES`. These always create an `order_type: "credits"`
           order.

        Anything else is a `400`.

        ## Amounts

        For a database plan: `finalPriceWithGst = price_inr === 1 ? 1 : round(price_inr * 1.18)`.
        For a hard-coded package: the package's own `priceWithGst`.
        `plan_type` of `credit` or `free` produces `order_type: "credits"` with
        `credits_purchased: 1`; anything else produces `order_type: "subscription"`.

        > **The credit quantity is not data-driven.** `subscription_plans` has
        > no credits column, so for *any* plan row the amount granted is the
        > literal `1` (`credits: isCreditPlan ? 1 : undefined` and
        > `credits_purchased: isCreditPlan ? 1 : null`). Adding a 50-credit
        > plan to the database would silently grant one. Only the hard-coded
        > `CREDIT_PACKAGES` fallback carries a real `credits` value, and all
        > three of those are currently `1` too.

        The `amount` in the response is always **paise** (rupees x 100), which
        is what Razorpay Checkout expects. `plan.priceWithGst` remains
        **rupees**. Mixed units in one body, so check the field you need.

        ## Idempotent reuse

        If the user has a matching `pending` order for the same plan, same
        amount, created in the last **10 minutes**, that order is returned
        instead of creating a new one. This is why abandoning a checkout and
        returning a few minutes later resumes the same `orderId`.
      x-auth: session-or-bearer
      x-owner-check: self
      x-known-issues:
        - id: PLAN-CREDITS-NOT-DATA-DRIVEN
          severity: medium
          summary: >-
            A plan row cannot express how many credits it grants, because subscription_plans has no
            credits column; the amount is the literal 1 for every database plan. A new
            multi-credit plan added to the database would be created and charged at full price
            while fulfilling with one credit.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planId:
                  type: string
                  description: Plan UUID or plan name. Preferred.
                packageId:
                  type: string
                  description: Legacy alias; used only when `planId` is absent. Matches the hard-coded package ids.
      responses:
        "200":
          description: |
            A Razorpay order, either freshly created or a reused pending
            order. The body carries `plan` for database plans and `package`
            for hard-coded packages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RazorpayOrderResponse"
        "400":
          description: "Neither `planId` nor `packageId` supplied, or the value matched no plan or package."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
              examples:
                missingId:
                  value:
                    error: "Invalid request: planId or packageId required"
                unknownId:
                  value:
                    error: Invalid plan or package ID
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
                example:
                  error: Unauthorized
        "500":
          description: "Razorpay credentials missing, the Razorpay API call failed, or a database write failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"

  /api/payments/verify:
    post:
      tags: [Payments]
      operationId: verifyPayment
      summary: Verify a Razorpay payment and fulfil the order
      description: |
        The client-side completion step after Razorpay Checkout returns.

        Checks performed, in order: signature validity
        (`HMAC_SHA256(orderId|paymentId, RAZORPAY_KEY_SECRET)`), that the order
        exists, and that `order.user_id` matches the caller. Only then is
        `fulfillOrder` called, which is idempotent - an order already
        `completed` returns `{"alreadyCompleted": true}` without granting
        anything twice.

        `fulfillOrder` grants credits for `order_type: "credits"`, or for
        `order_type: "subscription"` creates an `active` subscription expiring
        in `plan.duration_days` **and promotes the buyer's role to
        `astrologer`** (unless they are `admin`), **and auto-approves any
        `PENDING` astrologer application**. Those two side effects are
        surprising for an ordinary plan purchase; see `known-gaps.md`.

        Comparing the message distinguishes first-time fulfilment
        (`"Payment verified successfully"`) from a replay
        (`"Payment already verified"`).
      x-auth: session-or-bearer
      x-owner-check: self
      x-known-issues:
        - id: PAYMENT-PROMOTES-ASTROLOGER
          severity: high
          summary: >-
            Any successful subscription purchase sets the buyer's role to astrologer and approves
            pending applications. astrologer is a privilege tier, not a marketing label: it grants
            PUT /api/analysis/{analysisId}/approve, skips report_paid on /api/analysis/full-report,
            and may analyse any project from POST /api/analysis. A customer who buys a plan is
            therefore escalated to staff privileges.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentRequest"
      responses:
        "200":
          description: Payment verified and fulfilled.
          content:
            application/json:
              schema:
                type: object
                required: [message, status, orderType]
                properties:
                  message:
                    type: string
                    enum: [Payment verified successfully, "Payment already verified"]
                  status:
                    type: string
                    const: completed
                  orderType:
                    type: string
                    enum: [credits, subscription]
        "400":
          description: Missing payment details, or the signature does not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
              examples:
                missing:
                  value:
                    error: Missing payment details
                badSignature:
                  value:
                    error: Invalid signature
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "403":
          description: The order exists but belongs to a different user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "404":
          description: No order with that `razorpay_order_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "500":
          description: "Fulfillment failure, or `RAZORPAY_KEY_SECRET` unset."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"

  /api/payments/webhook:
    post:
      tags: [Payments]
      operationId: razorpayWebhook
      summary: Razorpay server-to-server webhook receiver
      description: |
        Called by Razorpay, not by browsers. Authenticates with
        `x-razorpay-signature` = `HMAC_SHA256(rawBody, RAZORPAY_WEBHOOK_SECRET)`
        computed over the **raw** request text, so the body must not be
        re-serialised before verification.

        Every accepted event is written to `razorpay_events` first, then
        handled:

        | Event | Effect |
        | --- | --- |
        | `payment.captured` | `fulfillOrder` on `payload.payment.entity.order_id` |
        | `order.paid` | `fulfillOrder` on `payload.order.entity.id` |
        | `subscription.cancelled` | Set matching subscription to `cancelled`, stamp `cancelled_at`, clear `auto_renew` |
        | `subscription.renewed` | Extend `expires_at` by `plan.duration_days` and set `status: "active"` |

        Any other `event` value is still recorded and then marked
        `processed: true` without further action, and the route returns
        `200 {"received": true}`. Only a missing/invalid signature or an
        internal error produce a non-2xx.

        This is the reliable path for fulfilment: if a user's browser closes
        before calling `/api/payments/verify`, `payment.captured` still lands
        here.

        > **`subscription.renewed` and `subscription.cancelled` never match.**
        > Both filter on `razorpay_subscription_id`, but `fulfillOrder` creates
        > `user_subscriptions` rows without ever setting that column, and
        > `POST /api/subscription` does not set it either. Every locally
        > created subscription therefore has a `NULL` value there, so the
        > `updateMany` matches nothing. Renewals do not extend local expiry and
        > cancels are only ever applied by the client-facing route.

        There is no replay protection: `razorpay_events` is written but never
        read, so nothing consults it to skip a previously processed event. A
        replayed `payment.captured` is nonetheless harmless, because
        `fulfillOrder` short-circuits on `order.status === "completed"`.
      x-auth: webhook-signature
      x-owner-check: not-applicable
      x-known-issues:
        - id: WEBHOOK-EVENTS-NOT-READ
          severity: low
          summary: >-
            razorpay_events is append-only and never queried, so it is an audit
            log rather than an idempotency or replay guard. Nothing reads it to
            skip a duplicate event; duplicate fulfilment is prevented only by the
            order status check inside fulfillOrder.
        - id: WEBHOOK-SUBSCRIPTION-EVENTS-DEAD
          severity: medium
          summary: >-
            subscription.renewed and subscription.cancelled both filter on
            razorpay_subscription_id, but no code path ever populates that column,
            so both handlers match zero rows. Renewals never extend local
            expiry_at and remote cancellations are never observed.
      security:
        - razorpayWebhookSignature: []
      requestBody:
        required: true
        description: Raw Razorpay event JSON. Must be sent unaltered for HMAC verification.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RazorpayWebhookEvent"
      responses:
        "200":
          description: Event recorded and processed (or ignored as unrecognised).
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    const: true
        "400":
          description: Missing or invalid `x-razorpay-signature`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "500":
          description: 'JSON parse failure or a database write failure. The event may have been recorded with `processed: false`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"

  /api/subscription:
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      summary: Read the caller's current subscription
      description: |
        Returns the most recently created row with status `active` or
        `trialing`, including the joined `plans` object, plus a computed
        `is_active` boolean comparing `expires_at` to now.

        Two caveats:

        * The status filter is applied **without** checking `expires_at`, so a
          lapsed-but-still-`active` row is returned. Trust `is_active`, not
          `status`.
        * `is_active` is computed but nothing else here re-checks expiry; the
          enforcement points are `checkPaymentAccess` and the per-route credit
          checks.
      x-auth: session-or-bearer
      x-owner-check: self
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: The subscription, or `null` when there is no active or trialing row.
          content:
            application/json:
              schema:
                type: object
                required: [subscription]
                properties:
                  subscription:
                    oneOf:
                      - $ref: "#/components/schemas/UserSubscription"
                      - type: "null"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "500":
          description: Database failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"

  /api/subscription/cancel:
    post:
      tags: [Subscriptions]
      operationId: cancelSubscription
      summary: Cancel the caller's active subscription
      description: |
        Looks up a row by `subscriptionId` scoped to the caller **and** to
        `status: "active"`. A `trialing` subscription is not matched, so it
        cannot be cancelled through this endpoint.

        If the row has a `razorpay_subscription_id`, it calls
        `razorpay.subscriptions.cancel(...)`. **A Razorpay failure is caught and
        logged, and the local row is cancelled anyway** - so the database can
        drift out of sync with Razorpay and an auto-renewing subscription may
        keep charging. The request also accepts `razorpaySubscriptionId` in
        the body but ignores it; the stored column is always used.

        Access is revoked immediately: the row becomes `cancelled` with
        `auto_renew: false` and a `cancelled_at` stamp.
      x-auth: session-or-bearer
      x-owner-check: self
      x-known-issues:
        - id: CANCEL-DRIFT
          severity: medium
          summary: >-
            The Razorpay cancel call is wrapped in a try/catch that only logs, and the local row is
            cancelled anyway, so a remote failure leaves the customer still being charged while the
            app shows them as cancelled. Compounding this, razorpay_subscription_id is never
            populated by any code path, so the cancelSubscription call is currently dead and the
            remote side is never told at all.
        - id: CANCEL-IGNORES-TRIALING
          severity: low
          summary: >-
            The lookup requires status: 'active' exactly, so a trialing subscription returns 404
            "Subscription not found" and cannot be cancelled through this route.
        - id: CANCEL-BODY-FIELD-IGNORED
          severity: low
          summary: >-
            razorpaySubscriptionId is destructured from the request body and never used; the handler
            reads subscription.razorpay_subscription_id from the database instead. The field is
            accepted and silently ignored, which implies a client-supplied override that does not
            exist.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscriptionId]
              properties:
                subscriptionId:
                  type: string
                  format: uuid
                  description: The local `user_subscriptions.id`.
                razorpaySubscriptionId:
                  type: string
                  description: Accepted but ignored; the stored column is used instead.
      responses:
        "200":
          description: Cancelled locally (and, if reachable, at Razorpay).
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    const: Subscription cancelled successfully
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "404":
          description: No `active` subscription with that id for this user. Also covers `trialing` rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"
        "500":
          description: Database or Razorpay failure outside the swallowed block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageField"

  /api/astrologer/apply:
    post:
      tags: [Astrologer]
      operationId: applyAsAstrologer
      summary: Submit an astrologer application
      description: |
        Creates an `astrologer_applications` row with `status: "PENDING"`.
        Takes no request body - the applicant cannot supply any details.

        A profile is created on demand if the authenticated id has none. The
        route refuses to create a second application while one is `PENDING` or
        `APPROVED`, so a `REJECTED` application is the only state that can be
        re-applied from. The `astrologer_applications` table has no `reviewed_by`
        or rejection reason column, so `REJECTED` is never actually written by
        any route in this codebase - the "re-apply" path is currently
        unreachable.

        Approval is the only other way in, and it happens either via
        `/api/admin/applications/approve` or **implicitly on any subscription
        purchase**.
      x-auth: session-or-bearer
      x-owner-check: self
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "201":
          description: Application created in `PENDING`.
          content:
            application/json:
              schema:
                type: object
                required: [message, application]
                properties:
                  message:
                    type: string
                    const: Application submitted successfully
                  application:
                    $ref: "#/components/schemas/AstrologerApplication"
        "400":
          description: A `PENDING` or `APPROVED` application already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "500":
          description: Returns `message` plus the raw `error.message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/astrologer/application-status:
    get:
      tags: [Astrologer]
      operationId: getAstrologerApplicationStatus
      summary: Read the caller's latest astrologer application
      description: |
        Returns the most recently created `astrologer_applications` row for the
        caller, or `{ "application": null }` if they have never applied. This is
        a plain read scoped to the caller's own id.
      x-auth: session-or-bearer
      x-owner-check: self
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: The latest application, or `null`.
          content:
            application/json:
              schema:
                type: object
                required: [application]
                properties:
                  application:
                    oneOf:
                      - $ref: "#/components/schemas/AstrologerApplication"
                      - type: "null"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "500":
          description: Returns `message` plus the raw `error.message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/astrologer/projects:
    get:
      tags: [Astrologer]
      operationId: listAstrologerProjects
      summary: List projects assigned to the caller
      description: |
        Requires `profiles.role === "astrologer"`; anything else is `403`.
        (Note that `dev` and `admin` are rejected here even though `dev` is
        accepted by `/api/analysis/{analysisId}/approve`.)

        Returns projects where `assigned_astrologer_id` equals the caller's id
        and `deleted_at IS NULL`, newest first, each with:

        | Key | Contents |
        | --- | --- |
        | `profiles` | The owner, projected to `email` only |
        | `map_plots_map_plots_project_idToprojects` | Active map plots, projected to `storage_path` |

        The `storage_path` values are **raw R2 keys, not URLs**. They are not
        presigned here, so a client must use `/api/projects/{projectId}` to get
        a usable URL.

        The Prisma relation key in the response
        (`map_plots_map_plots_project_idToprojects`) is a generated name, not
        something to depend on; it can change with the schema.
      x-auth: session-or-bearer
      x-owner-check: astrologer-role
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: Assigned projects plus the caller's astrologer profile.
          content:
            application/json:
              schema:
                type: object
                required: [projects, astrologer]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/AstrologerProject"
                  astrologer:
                    type: object
                    required: [role]
                    properties:
                      role:
                        type: string
                        const: astrologer
                      expert_code:
                        type: [string, "null"]
                        description: The `ASTRO-XXXXXX` code clients pass as `astrologer_code` when creating a project.
                      email:
                        type: [string, "null"]
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "403":
          description: Caller's role is not `astrologer`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Returns `message` plus the raw `error.message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/admin:
    get:
      tags: [Admin]
      operationId: adminDashboard
      summary: Plans and active subscriptions (admin only)
      description: |
        Requires `profiles.role === "admin"` - the check reads the database
        directly rather than the JWT claim, so a demotion takes effect
        immediately.

        Returns **all** plans including `is_active: false` ones, ordered by
        `price_inr`, plus every `active`/`trialing` subscription with its
        joined `plans` and the subscriber's `email`.
      x-auth: session-or-bearer
      x-owner-check: admin-role
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: Plans and active subscriptions.
          content:
            application/json:
              schema:
                type: object
                required: [plans, activeSubscriptions]
                properties:
                  plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionPlan"
                  activeSubscriptions:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/UserSubscription"
                        - type: object
                          properties:
                            profiles:
                              type: object
                              properties:
                                email:
                                  type: [string, "null"]
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "403":
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Database failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

    post:
      tags: [Admin]
      operationId: adminAction
      summary: Perform one of seven admin actions
      description: |
        Single dispatcher for all privileged mutations. Requires the
        `admin` role; the `action` field selects the operation.

        | `action` | Required fields | Effect |
        | --- | --- | --- |
        | `updateRole` | `userId`, `newRole` | Sets `profiles.role`. No validation of `newRole`. |
        | `adjustCredits` | `userId`, `amount` | Increments `user_credits` by `amount`, creating the row if absent. **Negative values are accepted and can drive a balance below zero.** |
        | `updateAstrologerAccess` | `userId`, `validFrom`, `validTo` | Sets the astrologer access window. `new Date(...)` parsing, so an unparseable string yields an `Invalid Date`. |
        | `createSubscriptionPlan` | `planData.name`, `planData.price_inr`, `planData.duration_days` | Inserts a plan. `plan_type` defaults to `"monthly"`. Returns `201` with the plan. |
        | `updateSubscriptionPlan` | `planId`, plus any of `planData.*` | Patches a plan. Optional fields: `name`, `description`, `price_inr`, `duration_days`, `plan_type`, `is_active`, `razorpay_plan_id`. Returns `200` with the plan. |
        | `deleteSubscriptionPlan` | `planId` | Deletes the plan. A Prisma `P2003` surfaces as `500`, which is what happens if subscriptions still reference it. Returns `200` with a message only. |
        | `grantSubscription` | `userId`, `planId` | Inserts an `active` subscription expiring in `plan.duration_days`, with `auto_renew: false`. Returns `201` with the subscription. |
        | `cancelUserSubscription` | `userId` | Cancels **all** `active`/`trialing` subscriptions for that user via `updateMany`. Returns `200` with a message only, even when nothing matched. |

        `updateRole`, `adjustCredits`, and `updateAstrologerAccess` fall through
        to the shared `200 { message, result: true }` envelope. The other five
        return their own object. The four "message only" cases carry no
        `result` field, so a client cannot distinguish "did something" from
        "matched nothing".

        `updateRole` accepts any string, so `updateRole` to a typo value can
        lock a user out of every role-gated route. There is no audit trail for
        any of these actions.
      x-auth: session-or-bearer
      x-owner-check: admin-role
      x-known-issues:
        - id: ADMIN-NEGATIVE-CREDITS
          severity: medium
          summary: >-
            adjustCredits accepts a negative amount with no floor check, so a single call can drive
            a balance arbitrarily below zero. Nothing in the API clamps or reconciles a negative
            credit balance, and checkPaymentAccess only tests credits > 0.
        - id: ADMIN-UNVALIDATED-ROLE
          severity: medium
          summary: >-
            updateRole writes newRole with no validation against the UserRole set, so a typo such
            as "astrologer" is accepted and locks the user out of every role-gated route. There is no
            way back through this API.
        - id: ADMIN-NO-AUDIT-TRAIL
          severity: low
          summary: >-
            No admin action writes an audit record. The acting admin's id is never stored alongside
            a mutation, and razorpay_events, the only append-only table in the schema, is not used
            here. A role or credit change cannot be attributed after the fact.
        - id: ADMIN-PLAN-FALSY-CHECK
          severity: low
          summary: >-
            updateSubscriptionPlan guards optional fields with truthiness
            (`if (planData?.price_inr)`), so a legitimate 0 for price_inr, duration_days or
            price-adjacent fields is silently ignored, while `description` and `is_active` use
            `!== undefined` and do accept falsy values. The two styles are inconsistent within the
            same branch.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: |
            Action completed. Five distinct body shapes; see the description
            for which action produces which.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AdminGenericSuccess"
                  - type: object
                    required: [message, plan]
                    properties:
                      message:
                        type: string
                        examples: ["Subscription plan updated.", "Subscription plan deleted."]
                      plan:
                        $ref: "#/components/schemas/SubscriptionPlan"
                  - type: object
                    required: [message, subscription]
                    properties:
                      message:
                        type: string
                        const: Subscription granted.
                      subscription:
                        $ref: "#/components/schemas/UserSubscription"
                  - $ref: "#/components/schemas/MessageOnly"
        "201":
          description: '`createSubscriptionPlan` or `grantSubscription` succeeded.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [message, plan]
                    properties:
                      message:
                        type: string
                        const: Subscription plan created.
                      plan:
                        $ref: "#/components/schemas/SubscriptionPlan"
                  - type: object
                    required: [message, subscription]
                    properties:
                      message:
                        type: string
                        const: Subscription granted.
                      subscription:
                        $ref: "#/components/schemas/UserSubscription"
        "400":
          description: "Missing fields for the chosen action, or an unrecognised `action`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "403":
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: '`grantSubscription` with a `planId` that does not exist.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Database failure. Returns `message` plus the raw `error.message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/admin/applications:
    get:
      tags: [Admin]
      operationId: listPendingApplications
      summary: List pending astrologer applications (admin only)
      description: |
        Requires the `admin` role. Returns every application with
        `status: "PENDING"`, newest first, each including the applicant's
        `profiles.email`.

        Note this filters on status only, so the list is not scoped to any
        particular admin and there is no review-claim or locking mechanism -
        two admins can open and approve the same application.
      x-auth: session-or-bearer
      x-owner-check: admin-role
      security:
        - bearerAuth: []
        - nextAuthSession: []
      responses:
        "200":
          description: Pending applications with applicant emails.
          content:
            application/json:
              schema:
                type: object
                required: [applications]
                properties:
                  applications:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/AstrologerApplication"
                        - type: object
                          properties:
                            profiles:
                              type: object
                              properties:
                                email:
                                  type: [string, "null"]
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "403":
          description: 'Caller is not an admin. Body is a bare `{ "message": "Forbidden" }`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Returns `message` plus the raw `error.message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

  /api/admin/applications/approve:
    post:
      tags: [Admin]
      operationId: approveAstrologerApplication
      summary: Approve an application and mint an expert code (admin only)
      description: |
        In one `prisma.$transaction`:

        1. the applicant's `role` becomes `astrologer`;
        2. a unique `expert_code` of the form `ASTRO-` plus six characters
           from `A-Z0-9` is generated (retrying on collision - the loop is
           unbounded in principle but collisions are unlikely);
        3. `valid_from` is set to now and `valid_to` to now + **365 days**;
        4. the application becomes `APPROVED` with `reviewed_at` stamped.

        The applicant is not notified and the `ASTRO-` code is returned only
        in this response - the admin must deliver it out of band, and the
        applicant can retrieve their own code from
        `/api/astrologer/projects`.

        A non-`PENDING` or unknown application returns `404`, so double
        approval is safe.

        The generated code grants real access: the new astrologer passes
        `checkPaymentAccess` and skips `report_paid` on
        `/api/analysis/full-report`, and can approve any analysis. The
        hard-coded one-year expiry is not configurable through the API - use
        `updateAstrologerAccess` to change it.
      x-auth: session-or-bearer
      x-owner-check: admin-only
      x-known-issues:
        - id: NO-REJECT-ACTION
          severity: medium
          summary: >-
            There is no reject path anywhere in the API. An application can only be PENDING or
            APPROVED, and POST /api/astrologer/apply blocks a new application while either is
            present, so an unwanted applicant is stuck in the queue permanently unless the database
            is edited directly.
        - id: EXPERT-CODE-NOT-CSPRNG
          severity: low
          summary: >-
            generateExpertCode uses Math.random() over a 36-character alphabet for the six
            characters, not a CSPRNG. The value is checked for uniqueness with a read-then-write
            query, so two concurrent approvals can generate the same code and the second write will
            fail the @unique constraint and roll back the whole transaction.
        - id: APPROVAL-UNNOTIFIED
          severity: low
          summary: >-
            The applicant is not notified of approval and the ASTRO- code is returned only in this
            response, so it must be delivered out of band. The applicant can later read their own
            code from GET /api/astrologer/projects, which softens this.
      security:
        - bearerAuth: []
        - nextAuthSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId]
              properties:
                applicationId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Approved. The expert code appears only here.
          content:
            application/json:
              schema:
                type: object
                required: [message, expertCode]
                properties:
                  message:
                    type: string
                    const: Application approved successfully
                  expertCode:
                    type: string
                    pattern: "^ASTRO-[A-Z0-9]{6}$"
                    example: ASTRO-K7F2Q9
        "400":
          description: '`applicationId` absent from the body.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/UnauthorizedMessage"
        "403":
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Unknown application, or its status was not `PENDING`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Returns `message` plus the raw `error.message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageAndError"

components:
  securitySchemes:
    nextAuthSession:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: |
        NextAuth v4 JWT session cookie.

        * Development: `next-auth.session-token`
        * Production: `__Secure-next-auth.session-token`

        `httpOnly`, `SameSite=Lax`, `Path=/`, and `Secure` in production. The
        cookie is set only by the NextAuth flow at `/api/auth/*`; none of the
        other routes set cookies.

        The session cookie is a NextAuth JWT signed with `NEXTAUTH_SECRET`.
        `middleware.ts` reads it with `getToken` to protect the `/projects`,
        `/portal`, and `/admin` **pages** - that is a UI concern only. API
        authorization is done independently by `validateAuth()`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Mobile JWT issued by `/api/mobile/auth/{signup,login,google}`.

        * HS256, signed with `NEXTAUTH_SECRET` (the same secret as the session
          cookie).
        * Payload: `{ id, email, role }`.
        * Lifetime: **30 days**, with no refresh and no server-side
          revocation.
        * Sent as `Authorization: Bearer <token>`.

        `validateAuth()` tries this header **before** the session cookie, so a
        request carrying both is resolved by the Bearer token. A malformed or
        mis-signed Bearer token does not produce a `401` - it is swallowed and
        the cookie is tried instead.
    razorpayWebhookSignature:
      type: apiKey
      in: header
      name: x-razorpay-signature
      description: |
        `HMAC_SHA256(raw_request_body, RAZORPAY_WEBHOOK_SECRET)` as lowercase
        hex. Verified against the raw text, so proxies that re-serialise JSON
        will break it. Only `/api/payments/webhook` uses this.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: The `projects.id` UUID.
      schema:
        type: string
        format: uuid
    ObjectId:
      name: objectId
      in: path
      required: true
      description: The `project_objects.id` UUID.
      schema:
        type: string
        format: uuid
    AnalysisIdPath:
      name: analysisId
      in: path
      required: true
      description: The `analyses.id` UUID.
      schema:
        type: string
        format: uuid
    AnalysisIdQuery:
      name: analysisId
      in: query
      required: true
      description: |
        The `analyses.id` UUID. Used by the `devta`, `full-report`, and
        `marma` routes, which read the boundary and objects from this row.
      schema:
        type: string
        format: uuid
    GridTypeQuery:
      name: gridType
      in: query
      required: false
      description: |
        Devta grid resolution. The Python engine accepts only `"81"`
        (Paramasayika 9x9) and `"64"` (Manduka 8x8); anything else is a `422`
        from the engine. Defaults to `"81"`.
      schema:
        type: string
        default: "81"
        enum: ["81", "64"]
    AssetKey:
      name: key
      in: path
      required: true
      description: |
        Slash-separated R2 object key. The route is a catch-all, so every
        remaining path segment becomes part of the key - e.g.
        `/api/public-assets/public/logo.svg` looks up the R2 object
        `public/logo.svg`.
      schema:
        type: string
      explode: true

  responses:
    UnauthorizedMessage:
      description: |
        No usable credential. **Which key is used is inconsistent**: most routes
        return `{ "message": "Unauthorized" }`, but the five routes under
        `/api/projects/{projectId}` and
        `/api/projects/{projectId}/objects` return `{ "error": "Unauthorized" }`,
        and `/api/upload` returns
        `{ "message": "Unauthorized: No token provided" }`.

        Read both `message` and `error` — see `errors.md`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorMessage"
              - $ref: "#/components/schemas/ErrorMessageField"
          examples:
            messageKey:
              summary: Most routes
              value:
                message: Unauthorized
            errorKey:
              summary: /api/projects/** and /api/projects/*/objects
              value:
                error: Unauthorized
            noTokenProvided:
              summary: /api/upload only
              value:
                message: "Unauthorized: No token provided"
    ServerErrorMessage:
      description: |
        Unexpected failure. Usually `{ "error": "Internal server error" }`, but
        a number of handlers return `{ "message": "..." }` instead, and
        `/api/analysis/devta` returns both keys together. Callers cannot
        correlate any of these with anything server-side.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorMessage"
              - $ref: "#/components/schemas/ErrorMessageField"
              - $ref: "#/components/schemas/ErrorMessageAndError"
          example:
            error: Internal server error

  schemas:
    UserRole:
      type: string
      description: |
        Roles present in the codebase. `user` is the default; `admin` bypasses
        every payment gate; `astrologer` skips project-ownership checks on
        report reads and can approve analyses; `dev` can approve analyses but
        cannot list astrologer projects.
      enum: [user, astrologer, dev, admin]

    Point:
      type: object
      description: |
        A canvas-coordinate point, **normalised to `[0, 1]` with the Y axis
        pointing down** (screen convention). The Python engine flips Y on the
        way in and back on the way out, so this orientation is required -
        sending math-convention Y will place every zone and devta incorrectly
        but will not error.
      required: [x, y]
      properties:
        x:
          type: number
          format: double
          minimum: 0
          maximum: 1
        y:
          type: number
          format: double
          minimum: 0
          maximum: 1
      additionalProperties: false

    PointList:
      type: array
      description: A closed polygon. The engine does not require the first point to be repeated at the end.
      items:
        $ref: "#/components/schemas/Point"

    EngineHealth:
      type: object
      description: Body produced by the Python engine's `GET /health`, forwarded verbatim.
      required: [status, engine]
      properties:
        status:
          type: string
          const: ok
        engine:
          type: string
          const: vastu-spatial-v5.2
      additionalProperties: true

    HealthUnreachable:
      type: object
      description: The fetch to the Python engine threw (DNS failure, connection refused, timeout).
      required: [status, message]
      properties:
        status:
          type: string
          const: error
        message:
          type: string
          const: 'Health check failed: Could not connect to the Python service.'

    HealthEngineDown:
      type: object
      description: The Python engine answered with a non-2xx status. `serviceStatus` echoes that status.
      required: [status, message, serviceStatus]
      properties:
        status:
          type: string
          const: error
        message:
          type: string
          const: 'Health check failed: Python service is unreachable or unhealthy.'
        serviceStatus:
          type: integer
          description: The upstream HTTP status.

    NextAuthSession:
      type: object
      description: Body of `GET /api/auth/session`.
      properties:
        user:
          oneOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: [string, "null"]
                name:
                  type: [string, "null"]
                image:
                  type: [string, "null"]
                role:
                  type: string
                  $ref: "#/components/schemas/UserRole"
            - type: "null"
        expires:
          type: string
          format: date-time
          description: When the session JWT expires.

    NextAuthProviders:
      type: object
      description: Body of `GET /api/auth/providers`.
      properties:
        google:
          type: object
          properties:
            id:
              type: string
              const: google
            name:
              type: string
            type:
              type: string
              const: oauth
            signinUrl:
              type: string
            callbackUrl:
              type: string
        credentials:
          type: object
          properties:
            id:
              type: string
              const: credentials
            name:
              type: string
            type:
              type: string
              const: credentials
            signinUrl:
              type: string
            callbackUrl:
              type: string

    NextAuthCsrf:
      type: object
      description: Body of `GET /api/auth/csrf`. Send the token back as `csrfToken` in the form post.
      properties:
        csrfToken:
          type: string

    AuthUser:
      type: object
      description: The `user` object of `GET /api/auth/user`.
      required: [id, profile]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, "null"]
          description: From the session, not from the database.
        profile:
          oneOf:
            - $ref: "#/components/schemas/UserProfile"
            - type: "null"

    CurrentUserEnvelope:
      type: object
      description: "`{ user: null }` when signed out - still a `200`."
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"

    UserProfile:
      type: object
      description: Profile plus the two derived fields the route adds.
      required: [id, role, credits, has_active_subscription]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/UserRole"
        valid_from:
          type: [string, "null"]
          format: date-time
          description: Start of the astrologer access window. Unset for everyone else.
        valid_to:
          type: [string, "null"]
          format: date-time
          description: End of the astrologer access window.
        credits:
          type: integer
          description: Current credit balance; `0` when the row is missing.
        has_active_subscription:
          type: boolean
          description: True when a `user_subscriptions` row is `active` or `trialing` **and** `expires_at` is in the future.

    MobileAuthResponse:
      type: object
      description: Body of every successful mobile auth call.
      required: [message, token, user]
      properties:
        message:
          type: string
          examples: [Login successful, Registration successful, "Google Login successful"]
        token:
          type: string
          description: |
            HS256 JWT signed with `NEXTAUTH_SECRET`, payload
            `{ id, email, role }`, `exp` 30 days out. Send it as
            `Authorization: Bearer <token>`.
        user:
          type: object
          required: [id, email, role]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            role:
              $ref: "#/components/schemas/UserRole"

    ErrorMessage:
      type: object
      description: "`{ message }` - used by the projects, objects, and analysis routes."
      required: [message]
      properties:
        message:
          type: string
      additionalProperties: true

    ErrorMessageField:
      type: object
      description: "`{ error }` - used by the auth, payments, subscription, and marma routes."
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: true

    ErrorMessageAndError:
      type: object
      description: |
        `{ message, error }` - the human message plus the **raw** internal
        error text. This is the shape to watch for: it leaks database and
        library internals (Prisma codes, SQL fragments) to the client.
      required: [message]
      properties:
        message:
          type: string
        error:
          type: string
          description: Raw `error.message`, unsanitised.

    ErrorAndDetails:
      type: object
      description: "`{ error, details }` - also leaks raw internals, via `details`."
      required: [error]
      properties:
        error:
          type: string
        details:
          type: string
          description: Raw `error.message`, unsanitised.

    NeedsPayment:
      type: object
      description: |
        `{ message, needs_payment: true }` - the only machine-readable
        "you must buy something" signal in the API. It appears on
        `POST /api/analysis` (unreachable in practice) and
        `POST /api/analysis/{analysisId}/deduct-credit-for-report`.
      required: [message, needs_payment]
      properties:
        message:
          type: string
        needs_payment:
          type: boolean
          const: true

    MessageOnly:
      type: object
      description: "`{ message }` with no indicator of what actually changed."
      required: [message]
      properties:
        message:
          type: string

    Project:
      type: object
      description: A row of the `projects` table. Nullable members are returned as `null`, never omitted.
      required: [id, user_id, name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        boundary_normalized:
          oneOf:
            - $ref: "#/components/schemas/PointList"
            - type: "null"
          description: Plot outline. Set by `PATCH /api/projects/{projectId}` or taken from the analysis.
        north_direction:
          type: [number, "null"]
          format: double
          description: |
            Clockwise canvas angle in degrees from the plot's own "up" to
            True North. `0` means the canvas top is already North. The Python
            engine internally negates this, so do not pre-negate it.
          default: 0
        created_at:
          type: [string, "null"]
          format: date-time
        creator_name:
          type: [string, "null"]
        report_for:
          type: [string, "null"]
        status:
          type: string
          description: Defaults to `active`; `PATCH` writes whatever you send.
          default: active
        deleted_at:
          type: [string, "null"]
          format: date-time
          description: Soft-delete marker. No API route sets it; `GET /api/projects` filters on it being null.
        completed_at:
          type: [string, "null"]
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
        active_map_plot_id:
          type: [string, "null"]
          format: uuid
          description: The `map_plots` row currently serving as the plot image.
        plot_width:
          type: [number, "null"]
          format: double
        plot_height:
          type: [number, "null"]
          format: double
        plot_diagonal:
          type: [number, "null"]
          format: double
          description: The front-left to back-right diagonal. Validated at creation time.
        plot_side_back:
          type: [number, "null"]
          format: double
        plot_side_front:
          type: [number, "null"]
          format: double
        plot_side_left:
          type: [number, "null"]
          format: double
        plot_side_right:
          type: [number, "null"]
          format: double
        assigned_astrologer_id:
          type: [string, "null"]
          format: uuid
        expert_id:
          type: [string, "null"]
          format: uuid
          description: Present in the schema but never written by any route.
        metadata:
          type: [object, "null"]
          additionalProperties: true
          description: Free-form JSON. The server never reads it.
        video_path:
          type: [string, "null"]
          description: Raw R2 key, e.g. `videos/{userId}/{projectId}/1699..._clip.mp4`. Not a URL.

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The only strictly required field.
        creator_name:
          type: string
          description: Free text; who drew the plot.
        report_for:
          type: string
          description: Free text; who the report is about.
        plot_width:
          type: [number, string, "null"]
          description: Parsed with `parseFloat`, so numeric strings are accepted.
        plot_height:
          type: [number, string, "null"]
        plot_side_front:
          type: [number, string, "null"]
        plot_side_back:
          type: [number, string, "null"]
        plot_side_left:
          type: [number, string, "null"]
        plot_side_right:
          type: [number, string, "null"]
        plot_diagonal:
          type: [number, string, "null"]
        astrologer_code:
          type: [string, "null"]
          description: An `ASTRO-XXXXXX` expert code. Resolves to `assigned_astrologer_id`; an unknown code is ignored.
        expert_code:
          type: [string, "null"]
          description: Legacy alias for `astrologer_code`. `astrologer_code` wins when both are present.
        metadata:
          type: [object, "null"]
          additionalProperties: true
      additionalProperties: true

    UpdateProjectRequest:
      type: object
      description: |
        Every field is optional, but **at least one must be present** or the
        request is rejected with `400 No valid fields to update`.

        Keys outside this list are ignored, so `user_id`, `id`, and
        `deleted_at` cannot be set through this endpoint. Note the geometry
        values are written through **without** the validation applied by
        `POST /api/projects`.
      properties:
        boundary_normalized:
          $ref: "#/components/schemas/PointList"
        north_direction:
          type: number
          format: double
        plot_width:
          type: number
          format: double
        plot_height:
          type: number
          format: double
        plot_side_front:
          type: number
          format: double
        plot_side_back:
          type: number
          format: double
        plot_side_left:
          type: number
          format: double
        plot_side_right:
          type: number
          format: double
        plot_diagonal:
          type: number
          format: double
        assigned_astrologer_id:
          type: [string, "null"]
          format: uuid
          description: Set to `null` to unassign. No check that the target profile is actually an astrologer.
        status:
          type: string
          description: Any string. Writing `completed` also stamps `completed_at = now()`.
        metadata:
          type: [object, "null"]
          additionalProperties: true
      additionalProperties: true

    PlacedObjectSummary:
      type: object
      description: The reduced projection embedded in `GET /api/projects/{projectId}`.
      required: [id, object_type]
      properties:
        id:
          type: string
          format: uuid
        object_type:
          $ref: "#/components/schemas/ObjectType"
        boundary_normalized:
          $ref: "#/components/schemas/PointList"
        centroid:
          $ref: "#/components/schemas/Point"

    ObjectType:
      type: string
      description: |
        Object type. The Prisma `object_type` column is a plain `String`, and
        the `object_type` **enum** in `schema.prisma` is never referenced by
        any route, so this is not enforced - the engine will score an unknown
        type as neutral (`score_impact: 0`).
      enum:
        - BED
        - SOFA
        - TABLE
        - STAIRCASE
        - BEAM
        - COLUMN
        - MIRROR
        - AQUARIUM
        - BAR
        - KITCHEN_SLAB
        - STOVE
        - SINK
        - TOILET
        - WASHBASIN

    ProjectObject:
      type: object
      description: A row of the `project_objects` table.
      required: [id, project_id, object_type, boundary_normalized, centroid]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        object_type:
          $ref: "#/components/schemas/ObjectType"
        boundary_normalized:
          $ref: "#/components/schemas/PointList"
        centroid:
          $ref: "#/components/schemas/Point"
          description: |
            Used as a fallback when the object's polygon does not intersect
            any 16-zone, so a correct centroid still yields a direction.
        marma_distance:
          type: [number, "null"]
          format: double
          description: Present in the schema but never written by any route.
        issues:
          type: [object, array, "null"]
          description: Present in the schema but never written by any route.
        created_at:
          type: [string, "null"]
          format: date-time

    ReplaceObjectInput:
      type: object
      description: |
        One element of the `objects` array sent to
        `POST /api/projects/{projectId}/objects`.

        Unlike `UpdateObjectRequest` this route reads **`object_type`**, not
        `type`. Anything else in the element is dropped, so `id`, `marma_distance`,
        and `issues` are ignored and cannot be set.
      required: [object_type, boundary_normalized, centroid]
      properties:
        object_type:
          $ref: "#/components/schemas/ObjectType"
        boundary_normalized:
          $ref: "#/components/schemas/PointList"
        centroid:
          $ref: "#/components/schemas/Point"

    UpdateObjectRequest:
      type: object
      description: |
        Body for `PUT /api/projects/{projectId}/objects/{objectId}` and for
        each element of `objectsToSave` in the batch route.

        Send the type as **`type`**. The remaining keys are spread straight
        into the Prisma update, so `boundary_normalized`, `centroid`,
        `marma_distance`, and `issues` can all be written. Do **not** send
        `id` - it is not excluded and will be attempted as a primary-key
        change.
      properties:
        type:
          $ref: "#/components/schemas/ObjectType"
        boundary_normalized:
          $ref: "#/components/schemas/PointList"
        centroid:
          $ref: "#/components/schemas/Point"
        marma_distance:
          type: [number, "null"]
          format: double
        issues:
          type: [object, array, "null"]
        zone:
          type: string
          description: Accepted and silently discarded by both routes.
      additionalProperties: true

    Analysis:
      type: object
      description: A row of the `analyses` table.
      required: [id, project_id, status, report_paid]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        status:
          type: string
          description: |
            `pending` on creation. `reviewed` is written by
            `GET /api/analysis/devta` and
            `PUT /api/analysis/{analysisId}/approve`. `failed` is read but never
            written by any route in this codebase. Prisma defaults new rows to
            `completed`, which is why `GET .../status` substitutes
            `"completed"` for a falsy status.
          default: completed
        created_at:
          type: [string, "null"]
          format: date-time
        analysis_type:
          type: [string, "null"]
          description: Free text written straight from the request; never interpreted server-side.
        analysis_timestamp:
          type: [string, "null"]
          format: date-time
          description: ISO-8601 instant derived from `analysisDate` + `analysisTime`, or `null`.
        boundary_normalized:
          oneOf:
            - $ref: "#/components/schemas/PointList"
            - type: "null"
        north_direction:
          type: [number, "null"]
          format: double
        report_paid:
          type: boolean
          description: |
            The report paywall flag. Set by
            `POST /api/analysis/{analysisId}/deduct-credit-for-report`; it is
            per-analysis and not revoked by a refund. Admins and astrologers
            bypass it on read.
          default: false

    CreateAnalysisRequest:
      type: object
      required: [projectId, analysisType, boundary_normalized, north_direction]
      properties:
        projectId:
          type: string
          format: uuid
        analysisType:
          type: string
          description: Stored verbatim and never read. Use it for your own bookkeeping.
        boundary_normalized:
          $ref: "#/components/schemas/PointList"
        north_direction:
          type: number
          format: double
          description: Required, and `0` is valid - the check is `=== undefined`, not a truthiness test.
        analysisDate:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-2]{2}-[0-9]{2}$"
          description: Optional. Strictly `YYYY-MM-DD`; anything else is a `400`. Must not be in the future.
        analysisTime:
          type: [string, "null"]
          pattern: "^[0-9]{2}:[0-9]{2}$"
          description: Optional, and only meaningful alongside `analysisDate`. Defaults to `00:00`.
      additionalProperties: true

    ObjectAnalysisRequest:
      type: object
      description: |
        Body of the engine's `/analyze_objects`, and the body
        `POST /api/analysis/objects` forwards verbatim. It is the shape the
        server itself builds when calling
        `GET /api/analysis/full-report`.
      required: [boundary_normalized, placed_objects]
      properties:
        boundary_normalized:
          $ref: "#/components/schemas/PointList"
        north_direction:
          type: number
          format: double
          default: 0
        grid_type:
          type: string
          description: The engine rejects anything but these two with a `422`.
          default: "81"
          enum: ["81", "64"]
        aspect_ratio:
          type: number
          format: double
          description: |
            Plot width divided by height. The engine divides vertical
            components by this value so wedge boundaries line up with screen
            angles. The `4:3` default is **not** derived from
            `plot_width`/`plot_height`, so a plot that is not 4:3 will get
            skewed angular zones unless the client sends the real ratio.
          default: 1.3333333333333333
        placed_objects:
          type: array
          description: Scored in array order; `total_score` is the sum.
          items:
            $ref: "#/components/schemas/EnginePlacedObject"

    EnginePlacedObject:
      type: object
      description: |
        The engine's own `PlacedObject` model. It requires `id` even though the
        engine only echoes it back as `object_id`, so generate a client-side
        identifier for unsaved objects.
      required: [id, object_type, boundary_normalized, centroid]
      properties:
        id:
          type: string
        object_type:
          $ref: "#/components/schemas/ObjectType"
        boundary_normalized:
          $ref: "#/components/schemas/PointList"
        centroid:
          $ref: "#/components/schemas/Point"
        rotation:
          type: [number, "null"]
          format: double
          description: Accepted and ignored by the engine.

    VastuAnalysisResult:
      type: object
      description: The engine's `VastuAnalysisResult`.
      required: [analyzed_objects, total_score, overall_percentage, overall_verdict]
      properties:
        analyzed_objects:
          type: array
          items:
            $ref: "#/components/schemas/AnalyzedObjectResult"
        total_score:
          type: integer
          description: Sum of every `score_impact`. **Negative means net negative; zero is not a good result.**
        overall_percentage:
          type: number
          format: double
          description: |
            `total_score` normalised between the worst and best achievable
            score for the rule set, clamped to `[0, 100]`. `100` when there are
            no placed objects.
        overall_verdict:
          type: string
          description: "`>= 90` EXCELLENT, `>= 60` GOOD, `>= 30` BAD, else CRITICAL."
          enum: [EXCELLENT, GOOD, BAD, CRITICAL]
        devta_areas_45:
          type: array
          items:
            $ref: "#/components/schemas/DevtaArea"
        devta_areas_32:
          type: array
          description: The 32 outer-ring devtas only.
          items:
            $ref: "#/components/schemas/DevtaArea"
        zone_areas_16:
          type: array
          items:
            $ref: "#/components/schemas/DevtaArea"
        zone_boundary_16:
          type: array
          description: Boundary length, not area - `area` here holds a length in normalised units.
          items:
            $ref: "#/components/schemas/DevtaArea"
        zones16:
          type: array
          items:
            $ref: "#/components/schemas/Region"
        zones8:
          type: array
          items:
            $ref: "#/components/schemas/Region"
        devtas45:
          type: array
          description: |
            The 45-devta mandala. **This is emptied for non-premium callers by
            `/api/analysis/devta`.**
          items:
            $ref: "#/components/schemas/Region"
        plot_centroid:
          oneOf:
            - $ref: "#/components/schemas/Point"
            - type: "null"

    AnalyzedObjectResult:
      type: object
      required: [object_id, object_type, score_impact, verdict, message]
      properties:
        object_id:
          type: string
          description: Echoes the `id` you sent.
        object_type:
          $ref: "#/components/schemas/ObjectType"
        devta_region:
          type: [string, "null"]
          description: Name of the devta with the **largest area overlap** with this object, or `null` if there is none.
        zone16_direction:
          type: [string, "null"]
          enum: [N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSW, SW, WSW, W, WNW, NW, NNW, null]
          description: Resolved by largest polygon overlap, falling back to the centroid angle when the object misses every zone wedge.
        score_impact:
          type: integer
          description: "Positive is favourable, negative is unfavourable, `0` is neutral or unknown."
        grade:
          type: [string, "null"]
          description: Rule-set grade key, when one matches.
        verdict:
          type: string
          enum: [EXCELLENT, GOOD, BAD, CRITICAL]
        message:
          type: string
          description: When a grade matched, this is the **remedy text** for the placement, not a status description.

    DevtaArea:
      type: object
      required: [name, area, percentage]
      properties:
        name:
          type: string
        area:
          type: number
          format: double
        percentage:
          type: number
          format: double
          description: Share of the total plot area, `0`-`100`.

    Region:
      type: object
      description: |
        A drawable region returned by the engine. `polygon` uses the same
        normalised canvas convention as the request, so it can be fed straight
        back into a canvas path.
      required: [id, name, polygon, ring, source]
      properties:
        id:
          type: string
          examples: [d-1, zone16-1, zone8-4]
        name:
          type: string
          examples: [Brahma, Bhudhar, NNE]
        polygon:
          $ref: "#/components/schemas/PointList"
        ring:
          type: string
          description: |
            `center`, `middle`, or `outer` for devtas; `zone16` or `zone8` for
            direction zones. Always one of those five.
        startAngle:
          type: [number, "null"]
          format: double
        centerAngle:
          type: [number, "null"]
          format: double
        endAngle:
          type: [number, "null"]
          format: double
        source:
          type: string
          description: |
            How the region was derived. `grid-81` / `grid-64` mean the plot
            was detected as rectangular and a strict NxN grid was used;
            `angular-81` / `angular-64` mean it was irregular and concentric
            angular wedges were used instead; `directional` for direction zones.
        left_intersection:
          oneOf:
            - $ref: "#/components/schemas/Point"
            - type: "null"
        center_intersection:
          oneOf:
            - $ref: "#/components/schemas/Point"
            - type: "null"
        right_intersection:
          oneOf:
            - $ref: "#/components/schemas/Point"
            - type: "null"
        boundary_path:
          type: [array, "null"]
          description: Polyline of the plot wall inside this zone, for drawing thick directional bands.
          items:
            $ref: "#/components/schemas/Point"
        boundary_length:
          type: [number, "null"]
          format: double

    AnalysisGeometry:
      type: object
      description: Body of `GET /api/analysis/devta` (the engine's `AnalysisResponse`).
      required: [devtas45, zones16, zones8]
      properties:
        devtas45:
          type: array
          description: Empty for non-premium callers.
          items:
            $ref: "#/components/schemas/Region"
        zones16:
          type: array
          items:
            $ref: "#/components/schemas/Region"
        zones8:
          type: array
          items:
            $ref: "#/components/schemas/Region"
        plot_centroid:
          oneOf:
            - $ref: "#/components/schemas/Point"
            - type: "null"

    MarmaResult:
      type: object
      description: |
        Body of `GET /api/analysis/marma`, computed in-process by
        `lib/marmaAnalysis.ts`. Both arrays are in the same normalised canvas
        coordinates as the plot boundary.
      required: [marmaPoints, vanshaLines]
      properties:
        marmaPoints:
          type: array
          description: |
            Up to 14 named Marma intersections (Shirsha, Mukha, Hridhaya,
            Nabhi, L/R Sthana, Brahma's four corners, and the four edge
            midpoints) that fall inside the plot polygon. Only the raw points
            are returned - the names are **not** included, so a client has to
            match them positionally against its own known list.
          items:
            $ref: "#/components/schemas/Point"
        vanshaLines:
          type: array
          description: Line segments of the 25 Vansha lines clipped to the boundary. Each entry is a 2-point segment.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              $ref: "#/components/schemas/Point"

    SubscriptionPlan:
      type: object
      description: A row of the `subscription_plans` table.
      required: [id, name, price_inr, duration_days, plan_type, is_active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: |
            Also accepted as `planId` by `POST /api/payments`, matched
            case-insensitively. Duplicates across plans are possible in the
            schema, and the lookup uses `findFirst`, so the match is not
            deterministic if two plans share a name.
        description:
          type: [string, "null"]
        price_inr:
          type: integer
          description: |
            Pre-GST rupees. The amount charged is
            `price_inr === 1 ? 1 : round(price_inr * 1.18)`, so `999` becomes
            `1179` and `2500` becomes `2950`.
        duration_days:
          type: integer
        plan_type:
          type: string
          description: |
            `credit` or `free` produce a one-credit `credits` order; anything
            else produces a `subscription` order. `GET /api/payments` groups
            `credit` and `free` together as `creditPlans` and reserves
            `subscriptionPlans` for exactly `subscription`. Admin
            `createSubscriptionPlan` defaults this to `monthly`, which means
            newly created plans are treated as **subscriptions** and will
            promote the buyer to astrologer on payment.
          default: monthly
        features:
          type: [object, array, "null"]
          description: Free-form JSON, never parsed server-side.
        is_active:
          type: boolean
          default: true
        razorpay_plan_id:
          type: [string, "null"]
          description: Present and unique, but never sent to Razorpay - `createSubscription` exists in `lib/razorpay.ts` but no route calls it.
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time

    UserSubscription:
      type: object
      description: A row of the `user_subscriptions` table.
      required: [id, user_id, plan_id, status, started_at, expires_at, auto_renew]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        razorpay_subscription_id:
          type: [string, "null"]
          description: Only set for real Razorpay subscriptions. Admin-granted rows leave it `null`.
        razorpay_customer_id:
          type: [string, "null"]
        status:
          type: string
          description: "`active`, `trialing`, or `cancelled` are the values the code checks for."
          default: active
        started_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: The value that actually decides access. Compare against now, not against `status`.
        cancelled_at:
          type: [string, "null"]
          format: date-time
        auto_renew:
          type: boolean
          default: true
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
        plans:
          $ref: "#/components/schemas/SubscriptionPlan"
      additionalProperties: true

    RazorpayOrderResponse:
      type: object
      description: |
        Body of a successful `POST /api/payments`.

        **Units differ within one object**: `amount` is in **paise** because
        Razorpay Checkout requires it, while `plan.priceWithGst` and
        `package.priceInr` are in **rupees**. Divide `amount` by 100 to
        display it.
      required: [orderId, amount, currency]
      properties:
        orderId:
          type: string
          description: The `razorpay_order_id` to hand to Checkout, then send back to `/api/payments/verify`.
        amount:
          type: integer
          description: Paise. Rupees x 100.
        currency:
          type: string
          default: INR
        plan:
          allOf:
            - $ref: "#/components/schemas/SubscriptionPlan"
            - type: object
              properties:
                priceWithGst:
                  type: integer
                  description: Rupees actually charged, after the 18% rule. Present on both fresh and reused orders.
        package:
          type: object
          description: |
            Present **instead of** `plan` when the id matched one of the three
            hard-coded `CREDIT_PACKAGES` in `lib/razorpay.ts`. Those packages
            are not in the `subscription_plans` table, so they never appear
            in `GET /api/payments`.
          properties:
            id:
              type: string
              enum: [credits_1rs, basic_plan, advanced_plan]
            credits:
              type: integer
            priceInr:
              type: integer
            priceWithGst:
              type: integer
            name:
              type: string
            description:
              type: string
            relocationsLimit:
              type: integer
            mapUploadAllowed:
              type: boolean
            popular:
              type: boolean

    VerifyPaymentRequest:
      type: object
      required: [razorpay_order_id, razorpay_payment_id, razorpay_signature]
      properties:
        razorpay_order_id:
          type: string
          description: The `orderId` returned by `POST /api/payments`.
        razorpay_payment_id:
          type: string
        razorpay_signature:
          type: string
          description: The `razorpay_payment_id` and signature from the Razorpay Checkout handler.

    RazorpayWebhookEvent:
      type: object
      description: |
        A raw Razorpay event. Only `event` is read, plus a small part of
        `payload`; the rest is stored verbatim in `razorpay_events.payload`
        and never interpreted.
      required: [event]
      properties:
        event:
          type: string
          description: Handled values are `payment.captured`, `order.paid`, `subscription.cancelled`, and `subscription.renewed`. Any other value is recorded and ignored.
          examples: [payment.captured, order.paid, subscription.renewed, subscription.cancelled]
        payload:
          type: object
          description: |
            Event-specific. For `payment.captured` the route reads
            `payload.payment.entity.order_id`; for `order.paid`,
            `payload.order.entity.id`; for the subscription events,
            `payload.subscription.entity.id`.
          additionalProperties: true
      additionalProperties: true

    AstrologerApplication:
      type: object
      description: A row of the `astrologer_applications` table.
      required: [id, user_id, status]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          description: "`PENDING`, then `APPROVED` or `REJECTED` - though `REJECTED` is never written by any route."
          default: PENDING
        created_at:
          type: [string, "null"]
          format: date-time
        reviewed_at:
          type: [string, "null"]
          format: date-time
        profiles:
          type: object
          description: The applicant, included on admin routes only.
          properties:
            email:
              type: [string, "null"]

    AstrologerProject:
      type: object
      description: A project in the astrologer work list.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        creator_name:
          type: [string, "null"]
        report_for:
          type: [string, "null"]
        status:
          type: string
        plot_width:
          type: [number, "null"]
          format: double
        plot_height:
          type: [number, "null"]
          format: double
        plot_diagonal:
          type: [number, "null"]
          format: double
        plot_side_front:
          type: [number, "null"]
          format: double
        plot_side_back:
          type: [number, "null"]
          format: double
        plot_side_left:
          type: [number, "null"]
          format: double
        plot_side_right:
          type: [number, "null"]
          format: double
        assigned_astrologer_id:
          type: [string, "null"]
          format: uuid
        profiles:
          type: object
          description: The project owner, projected to `email` only.
          properties:
            email:
              type: [string, "null"]
        map_plots_map_plots_project_idToprojects:
          type: array
          description: |
            Active map plots with **raw R2 storage keys**, not presigned URLs.
            The key name is a Prisma-generated relation name and may change
            with the schema.
          items:
            type: object
            properties:
              storage_path:
                type: string
      additionalProperties: true

    AdminActionRequest:
      type: object
      required: [action]
      description: |
        A single request shape dispatching to eight different actions. Which
        fields are required depends entirely on `action`, and the API cannot
        tell you which are missing until you send the request.
      properties:
        action:
          type: string
          enum:
            - updateRole
            - adjustCredits
            - updateAstrologerAccess
            - createSubscriptionPlan
            - updateSubscriptionPlan
            - deleteSubscriptionPlan
            - grantSubscription
            - cancelUserSubscription
        userId:
          type: string
          format: uuid
          description: Required by `updateRole`, `adjustCredits`, `updateAstrologerAccess`, `grantSubscription`, and `cancelUserSubscription`.
        newRole:
          type: string
          description: Required by `updateRole`. Not validated against the known role list.
        amount:
          type: integer
          description: |
            Required by `adjustCredits`. Applied as an increment, so negative
            values are accepted and can drive a balance below zero.
        validFrom:
          type: [string, "null"]
          format: date-time
          description: Required by `updateAstrologerAccess`.
        validTo:
          type: [string, "null"]
          format: date-time
          description: Required by `updateAstrologerAccess`.
        planId:
          type: string
          format: uuid
          description: Required by `updateSubscriptionPlan`, `deleteSubscriptionPlan`, and `grantSubscription`.
        planData:
          type: object
          description: |
            The plan payload. `name`, `price_inr`, and `duration_days` are
            required on create and optional on update. `plan_type` defaults to
            `monthly` on create. `is_active` is only honoured on update, so a
            plan cannot be created already-inactive through this API.
          properties:
            name:
              type: string
            description:
              type: [string, "null"]
            price_inr:
              type: integer
            duration_days:
              type: integer
            plan_type:
              type: string
            features:
              type: [object, array, "null"]
            is_active:
              type: boolean
            razorpay_plan_id:
              type: [string, "null"]
          additionalProperties: true
      additionalProperties: true

    AdminGenericSuccess:
      type: object
      description: |
        Returned by `updateRole`, `adjustCredits`, and
        `updateAstrologerAccess`. `result` is a hard-coded `true` and is not
        evidence that anything matched - for example `adjustCredits` on an
        unknown `userId` creates a row with that balance rather than failing.
      required: [message, result]
      properties:
        message:
          type: string
          examples: ["Admin action 'updateRole' completed successfully."]
        result:
          type: boolean
          const: true

