name: Deploy Manglam App

on:
  push:
    branches:
      - main2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          debug: true # This will show us more info if the key still fails
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /var/www/nextapp
            
            git fetch origin main2
            git checkout main2
            git pull origin main2

            npm install
            npm run build

            # Fixed the quote here
            pm2 restart nextapp || pm2 start npm --name "nextapp" -- start
