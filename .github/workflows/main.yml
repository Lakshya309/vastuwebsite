name: Deploy Manglam App

on:
  push:
    branches:
      - main2  # The workflow triggers ONLY when you push to this branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true 
          script: |
            # 1. Setup the environment (Ubuntu 24.04 fix)
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            # If using NVM, this helps find 'npm'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 2. Go to your app folder
            cd /var/www/nextapp

            # 3. Pull the specific 'main2' branch
            git fetch origin main2
            git checkout main2
            git pull origin main2

            # 4. Install and Build
            npm install
            npm run build

            # 5. Restart with PM2
            # (Make sure 'manglam-app' is the name you gave it in PM2)
            pm2 restart nextapp || pm2 start npm --name "nextapp" -- start
